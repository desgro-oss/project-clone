<!DOCTYPE html>
<!-- Новости клиентов — страница NewsPage концепта ibp-redesign-v2 (решение
     пользователя 27.10.2026, макет Pixso «Новости», item 2605:122131).
     Переход с главной: «Все новости...», стрелка карточки «Новости клиентов»,
     клик по новости, карточка «Новости моих клиентов». Крошки: Главная / Новости.
     Слева — V2NewsListTile, справа — V2NewsArticleTile, между ними Splitter ДС.
     Источник: открывается собранной NewsPage.preview.html. -->
<html lang="ru">
<head>
<script src="../../../../ds-config.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Новости — IBP Redesign v2</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  body { margin: 0; font-family: var(--font-text), system-ui, sans-serif; color: var(--text-primary); background: var(--bg-page); }
  /* раскладка: сплиттер на всю оставшуюся высоту .screen--app; каждая
     панель — колонка, тайл в ней растягивается и прокручивает своё тело */
  .split-fill { flex: 1; min-height: 0; background: transparent; border: 0; border-radius: 0; } /* тайлы — карточки на фоне страницы, без рамки сплиттера (как MeetingsProtocolsPage, решение пользователя 20.10.2026) */
  .split-fill > .splitpane__panel { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: transparent; }
  /* узкая рабочая область: панели друг под другом — лента сверху, текст
     снизу; сплиттер не нужен. Ширину панели «a» Splitter ДС пишет инлайном
     (flex: 0 0 N%), поэтому перебивается с !important */
  @container screen (max-width: 899px) {
    .split-fill { flex-direction: column; gap: var(--space-12); }
    .split-fill > .spl { display: none; }
    .split-fill > .splitpane__a { flex: 0 0 40% !important; }
    .split-fill > .splitpane__b { flex: 1 1 0 !important; }
  }
</style>
<link rel="stylesheet" href="../widgets/tiles/V2NewsListTile/V2NewsListTile.css">
<link rel="stylesheet" href="../widgets/tiles/V2NewsArticleTile/V2NewsArticleTile.css">
</head>
<body>
<div class="nav-layout">
  <!-- ── Боковое меню: анатомия NavPanel; пункты, имя и роль пользователя
       заполняет data/nav-links.js (IBPR_NAV.mount) из каталога роли ── -->
  <nav class="nav nav--rail" id="nav" aria-label="Главное меню" data-nav-auto="no">
    <div class="nav__top">
      <button type="button" class="ibtn ibtn--neutral ibtn--m nav__burger" aria-label="Развернуть меню"><i data-icon="left-menu"></i></button>
      <button type="button" class="ibtn ibtn--neutral ibtn--m nav__pin" aria-pressed="false" aria-label="Закрепить панель"><i data-icon="pin-menu"></i></button>
    </div>
    <div class="nav__list" data-nav-list></div>
    <div class="nav__footer">
      <a class="nav__user" href="../../../../../index.html" aria-label="Хаб проектов">
        <span class="av av--circular av--m"><span class="av__text"></span></span>
        <span class="nav__user-text"><span class="nav__user-name"></span><span class="nav__user-role"></span></span>
      </a>
      <button type="button" class="ibtn ibtn--neutral ibtn--m nav__logout" aria-label="Выйти"><i data-icon="logout"></i></button>
    </div>
  </nav>

  <div class="screen screen--app">
    <nav class="crumbs" aria-label="Хлебные крошки" data-breadcrumbs>
      <li class="crumbs__item"><a class="link link--muted" href="HomeBoard.preview.html?mode=after">Главная</a></li>
      <li class="crumbs__item crumbs__item--current">
        <span class="crumbs__current" aria-current="page">Новости</span>
      </li>
    </nav>

    <main class="screen__content" data-screen-label="NewsPage">
      <!-- #sec:head ── Шапка страницы ────────────────────────────────────── -->
      <div class="phead">
        <div class="phead__main">
          <div class="phead__title-row"><div class="phead__title-group"><h1 class="phead__title">Новости</h1></div></div>
          <div class="phead__subtitle"><span class="phead__meta">Отображаются до 100 новостей за 3 месяца</span></div>
        </div>
      </div>

      <!-- #sec:content ── вкладки клиентов, лента и текст новости -->
      <div class="tabs tabs--horiz" data-tabs id="news-tabs" role="tablist" aria-label="Клиенты в новостях">
        <button type="button" class="tab tab--m tab--selected" role="tab" aria-selected="true" data-news-scope="my"><span class="tab__label">Мои клиенты</span></button>
        <button type="button" class="tab tab--m" role="tab" aria-selected="false" tabindex="-1" data-news-scope="desk"><span class="tab__label">Клиенты моего деска</span></button>
        <button type="button" class="tab tab--m" role="tab" aria-selected="false" tabindex="-1" data-news-scope="fav"><span class="tab__label">Избранные клиенты</span></button>
      </div>

      <div class="splitpane split-fill" id="news-split" data-off-grid="Панели Splitter: ширину задаёт сплиттер">
        <div class="splitpane__panel splitpane__a">
          <!-- Локальный компонент «Лента новостей» — левая панель страницы NewsPage:
     новости выбранной вкладки от новых к старым, выбранная подсвечена.
     Строки рисует V2NewsListTile.js (LcNewsListTile.render); страница
     вшивает фрагмент меткой <ds-include> и монтирует. -->
<section class="tile tile--headless lc-v2-news-list-tile" aria-label="Список новостей" id="news-list" data-state="data" data-mode="view" data-widget="V2NewsListTile" data-widget-group="tiles" data-widget-src="../widgets/tiles/V2NewsListTile/V2NewsListTile.html">
  <div class="tile__body lc-v2-news-list-tile__body ds-scroll">
    <!-- строки: кнопка на новость; выбранная — aria-current="true" -->
    <div class="lc-v2-news-list-tile__list" data-news-list></div>
    <!-- данных нет: во вкладке нет новостей за 3 месяца -->
    <div class="es es--m" data-news-empty hidden>
      <span class="illu es__illu" data-illu="empty-folder" aria-hidden="true"></span>
      <div class="es__body">
        <p class="es__title">Новостей нет</p>
        <p class="es__text">О клиентах этой вкладки за последние 3 месяца публикаций не было.</p>
      </div>
    </div>
  </div>
</section>
        </div>
        <div class="spl" role="separator" aria-orientation="vertical" aria-valuemin="25" aria-valuemax="60" aria-valuenow="34" aria-label="Изменить ширину панелей" tabindex="0">
          <span class="spl__grip"><i></i><i></i><i></i><i></i><i></i><i></i></span>
        </div>
        <div class="splitpane__panel splitpane__b">
          <!-- Локальный компонент «Новость» — правая панель страницы NewsPage:
     заголовок, дата · источник, полный текст по абзацам и «Смотреть
     источник». Содержимое рисует V2NewsArticleTile.js
     (LcNewsArticleTile.render). -->
<section class="tile tile--headless lc-v2-news-article-tile" aria-labelledby="lc-news-article-title" id="news-article" data-state="data" data-mode="view" data-widget="V2NewsArticleTile" data-widget-group="tiles" data-widget-src="../widgets/tiles/V2NewsArticleTile/V2NewsArticleTile.html">
  <div class="tile__body lc-v2-news-article-tile__body ds-scroll">
    <article class="lc-v2-news-article-tile__article" data-news-article>
      <h2 class="lc-v2-news-article-tile__title" id="lc-news-article-title" data-news-title></h2>
      <p class="lc-v2-news-article-tile__meta"><time data-news-date></time><span aria-hidden="true">·</span><span class="lc-v2-news-article-tile__source" data-news-source></span></p>
      <div class="lc-v2-news-article-tile__text" data-news-body></div>
      <div class="lc-v2-news-article-tile__actions">
        <a class="btn btn--outline btn--s" data-news-link target="_blank" rel="noopener noreferrer"><span class="btn__label">Смотреть источник</span><i data-icon="link-external"></i></a>
      </div>
    </article>
    <!-- новость не выбрана: вкладка без новостей -->
    <div class="es es--m" data-news-none hidden>
      <span class="illu es__illu" data-illu="empty-folder" aria-hidden="true"></span>
      <div class="es__body">
        <p class="es__title">Новость не выбрана</p>
        <p class="es__text">Выберите новость в списке слева.</p>
      </div>
    </div>
  </div>
</section>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="../../../../ds-body.js" data-ds="patterns/HomeRoles/ibp-home.js"></script>
<script src="../data/dictionaries.js"></script>
<script src="../data/employees.js"></script>
<script src="../data/clients.js"></script>
<script src="../data/opportunities.js"></script>
<script src="../data/potentials.js"></script>
<script src="../data/meetings.js"></script>
<script src="../data/tasks.js"></script>
<script src="../data/store.js"></script>
<script src="../data/nav-links.js"></script>
<script src="../data/news.js"></script>
<script src="../widgets/tiles/V2NewsListTile/V2NewsListTile.js"></script>
<script src="../widgets/tiles/V2NewsArticleTile/V2NewsArticleTile.js"></script>
<script>
/* Экранный скрипт: вкладка (?scope=my|desk|fav) отбирает новости, слева
   лента, справа выбранная (?id=N-…); выбор и вкладка пишутся в адрес без
   перезагрузки — ссылку на новость можно отдать. Набор вкладок — как у
   карточки «Новости клиентов» главной: мои — isMyClient, деск — все,
   избранные — isFavorite. */
(function () {
  'use strict';
  window.IBPR_NAV.mount({ active: 'home' });

  var SCOPES = {
    my: function (n) { return n.isMyClient; },
    desk: function () { return true; },
    fav: function (n) { return n.isFavorite; }
  };
  var params = new URLSearchParams(window.location.search);
  var scope = SCOPES[params.get('scope')] ? params.get('scope') : 'my';
  var selectedId = params.get('id');
  var listHost = document.getElementById('news-list');
  var articleHost = document.getElementById('news-article');

  function items() { return window.MOCK_NEWS.filter(SCOPES[scope]).slice(0, 100); }
  function writeUrl() {
    var p = new URLSearchParams(window.location.search);
    p.set('scope', scope);
    if (selectedId) p.set('id', selectedId); else p.delete('id');
    window.history.replaceState(null, '', window.location.pathname + '?' + p.toString());
  }
  function render() {
    var list = items();
    if (!list.some(function (n) { return n.newsId === selectedId; })) selectedId = list.length ? list[0].newsId : null;
    window.LcNewsListTile.render(listHost, { items: list, selectedId: selectedId, onSelect: select });
    window.LcNewsArticleTile.render(articleHost, { item: list.filter(function (n) { return n.newsId === selectedId; })[0] || null });
    writeUrl();
    /* выбранная (из ?id или по клику) — в видимой части ленты */
    /* на следующем кадре: при загрузке высота панели устанавливается после
       первой отрисовки (Splitter, ds-include), и ранний расчёт недокручивал */
    requestAnimationFrame(function () {
      var row = listHost.querySelector('[aria-current="true"]');
      if (row) row.scrollIntoView({ block: 'nearest' });
    });
  }
  function select(n) {
    selectedId = n.newsId;
    render();
    var b = listHost.querySelector('[data-news-id="' + n.newsId + '"]');
    if (b) b.focus();
  }

  /* вкладки: выбранная по адресу, переключение — штатный рантайм Tab ДС */
  var tabsEl = document.getElementById('news-tabs');
  tabsEl.querySelectorAll('.tab').forEach(function (b) {
    var on = b.getAttribute('data-news-scope') === scope;
    b.classList.toggle('tab--selected', on);
    b.setAttribute('aria-selected', on ? 'true' : 'false');
    b.setAttribute('tabindex', on ? '0' : '-1');
  });
  if (window.DSTabs) window.DSTabs.tabs(tabsEl, { onChange: function (i, b) {
    var next = b.getAttribute('data-news-scope');
    if (next === scope) return;
    scope = next;
    render(); /* выбранная остаётся, если она есть и в новой вкладке, иначе — первая */
  } });

  var split = document.getElementById('news-split');
  if (window.DSSplitter) window.DSSplitter.wire(split.querySelector('.spl'), { min: 25, max: 60, initial: 34 });

  render();
  if (window.dsIcons) window.dsIcons.apply(document);
})();
</script>
</body>
</html>
