<!DOCTYPE html>
<!-- HomePage — плиточная главная Руководителя IB и совместимый вход по роли.
     Аналитик ДИД (analyst) работает здесь; core_analyst — в dashboard-app (RE0044a).
     Меню и плитки собираются из данных роли (../data/navigation.js,
     ../data/dashboard.js), роль — параметр адреса ?role=<code> (коды —
     ../data/authentication.js, как LoginForRolesKeys фронтенда). Логина в
     прототипе нет: кнопка выхода в футере развёрнутого меню открывает окно
     «Сменить роль» — все роли по командам Post · Pre · IB · Core (как в ДС).
     Это служебный переход прототипа, в продукте его нет.
     Раскладка — стартовая страница Layout: шапки нет, контент — сетка групп
     .grid12 (.col-3 / .colw-6), группа — заголовок H6 (Regular) и NavTile, фон —
     background-illustration. Хлебных крошек нет (решение человека 29.10.2026).
     Спека — HomePage.screen.md. Контекст для правки:
     design-system/specs/_cheatsheet.md. CSS компонентов не читать. -->
<html lang="ru">
<head>
<script src="../../../ds-config.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Главная — IBP</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  body {
    margin: 0;
    font-family: var(--font-text), system-ui, sans-serif;
    color: var(--text-primary);
    background: var(--bg-page);
  }

  /* ── Раскладка этого экрана ──────────────────────────────────────────────
     Только раскладка на токенах. Сетку групп даёт штатная .grid12 из ДС,
     ширину группы — пара .col-3 / .colw-6; экран своей сетки не строит.

     Фоновая иллюстрация — признак стартовой страницы (Layout, «Раскладка
     стартовой страницы»): cover, opacity .6, под контентом. Крошек нет —
     высота обёртки на весь экран, а верхний отступ контента — 24 вместо 8
     (токен каркаса --layout-pad-top, решение человека 29.10.2026). */
  .screen { --layout-pad-top: var(--space-24); }
  .home-wrap { position: relative; min-height: 100vh; }
  .home-wrap::before {
    content: "";
    position: absolute;
    inset: 0;
    background: var(--boot-bg-illustration, none) center/cover no-repeat;
    opacity: .6;
    pointer-events: none;
  }
  .home-groups { position: relative; }
  .home-group { display: flex; flex-direction: column; gap: var(--space-16); min-width: 0; }
  .home-group .ntile { width: auto; min-width: 0; }

  /* окно смены роли: колонка команды — заголовок и кнопки ролей столбиком */
  .role-team { display: flex; flex-direction: column; gap: var(--space-12); min-width: 0; }
  .role-team__list { display: flex; flex-direction: column; gap: var(--space-8); }

  /* Перестроение 4 → 2 → 1. Первый шаг — штатная пара .col-N / .colw-N.
     Второй парой не выражается и пишется экраном, но обязан иметь ту же
     специфичность (0,2,0) и стоять ниже правила пары. */
  @container screen (max-width: 1700px) { .grid12 > [class*="colw-"] { grid-column: span var(--colw); } }
  @container screen (max-width: 900px)  { .grid12 > .home-group { grid-column: span 12; } }
</style>
</head>
<body>

<div class="nav-layout">

  <nav class="nav nav--rail" aria-label="Главное меню">
    <div class="nav__top">
      <button class="ibtn ibtn--neutral ibtn--m nav__burger" aria-label="Развернуть меню"><i data-icon="left-menu"></i></button>
      <button class="ibtn ibtn--neutral ibtn--m nav__pin" aria-pressed="false" aria-label="Закрепить панель"><i data-icon="pin-menu"></i></button>
    </div>
    <div class="nav__list" id="navList">
      <a class="nav__item nav__item--selected" href="#" aria-current="page"><span class="nav__ico"><i data-icon="main-page"></i></span><span class="nav__label">Главная</span></a>
      <!-- блоки меню роли — из ../data/navigation.js -->
    </div>
    <div class="nav__footer">
      <a class="nav__user" href="../../../../index.html" aria-label="Хаб проектов">
        <span class="av av--circular av--m"><span class="av__text" id="userInitials">АП</span></span>
        <span class="nav__user-text"><span class="nav__user-name" id="userName">Александров Пётр Константинович</span><span class="nav__user-role" id="userRole">Руководитель IB</span></span>
      </a>
      <button type="button" class="ibtn ibtn--neutral ibtn--m nav__logout" data-modal="roleModal" aria-haspopup="dialog" aria-label="Сменить роль / выйти"><i data-icon="logout"></i></button>
    </div>
  </nav>

  <div class="screen">
    <main class="screen__content">
      <div class="home-wrap">
        <div class="grid12 home-groups" id="homeGroups">
          <!-- группы плиток роли — из ../data/dashboard.js -->
        </div>
      </div>
    </main>
  </div>
</div>

<!-- Окно смены роли — служебный переход прототипа (в продукте роль приходит с логином).
     Открывает кнопка выхода в футере меню (.nav__logout, data-modal). -->
<div class="modal-scrim" id="roleModal" hidden>
  <div class="modal modal--w8" role="dialog" aria-modal="true" aria-labelledby="roleModalTitle">
    <header class="modal__head">
      <h2 class="modal__title" id="roleModalTitle">Сменить роль</h2>
      <button type="button" class="ibtn ibtn--neutral ibtn--l" aria-label="Закрыть"><i data-icon="close"></i></button>
    </header>
    <div class="modal__body">
      <div class="grid12" id="roleTeams"><!-- колонки команд — из ../data/authentication.js --></div>
    </div>
    <footer class="modal__foot">
      <div class="modal__foot-right">
        <button type="button" class="btn btn--accent btn--m" data-modal-close><span class="btn__label">Закрыть</span></button>
      </div>
    </footer>
  </div>
</div>

<script src="../data/authentication.js"></script>
<script src="../data/role-switch.js"></script>
<script src="../data/navigation.js"></script>
<script src="../data/dashboard.js"></script>
<script>
  /* Сборка меню и плиток по роли — до ds-body.js: рантаймы ДС оживляют уже
     готовую разметку. Роль — ?role=<code>; неизвестная — роль по умолчанию. */
  (function () {
    var esc = function (s) {
      return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    };
    var users = window.localUserList || [];
    var asked = new URLSearchParams(location.search).get('role');
    var role = users.filter(function (u) { return u.code === asked; })[0]
      || users.filter(function (u) { return u.code === window.DEFAULT_ROLE_CODE; })[0] || users[0];
    if (!role) return;
    if (role.code === 'core_analyst') {
      window.IBP_HOME_REDIRECT = window.roleHomeHref(role.code);
      location.replace(window.IBP_HOME_REDIRECT);
      return;
    }

    /* меню роли (NavigationItems) */
    var navHTML = (window.navigationItems[role.code] || []).map(function (block) {
      return '<div class="nav__block"><div class="nav__block-label">' + esc(block.title) + '</div>'
        + block.items.map(function (it, i) {
          /* пункт с подпунктами — аккордеон NavPanel (по умолчанию свёрнут) */
          if (it.links && it.links.length) {
            var sub = 'nav-sub-' + block.title.length + '-' + i + '-' + it.icon;
            return '<a class="nav__item nav__item--acc" href="#" aria-expanded="false" aria-controls="' + esc(sub) + '">'
              + '<span class="nav__ico"><i data-icon="' + esc(it.icon) + '"></i></span>'
              + '<span class="nav__label">' + esc(it.text) + '</span>'
              + '<span class="nav__caret"><i data-icon="chevron-down"></i></span></a>'
              + '<div class="nav__sub" id="' + esc(sub) + '"><div class="nav__sub-in">'
              + it.links.map(function (l) { return '<a class="nav__item" href="' + esc(l.href || '#') + '"><span class="nav__label">' + esc(l.text) + '</span></a>'; }).join('')
              + '</div></div>';
          }
          var badge = it.badge
            ? '<span class="nav__badge"><span class="badge badge--xs badge--accent" aria-hidden="true">' + esc(it.badge) + '</span></span>'
            : '';
          return '<a class="nav__item" href="' + esc(it.href || '#') + '"' + (it.badge ? ' aria-label="' + esc(it.text + ', ' + it.badge) + '"' : '') + '>'
            + '<span class="nav__ico"><i data-icon="' + esc(it.icon) + '"></i></span>'
            + '<span class="nav__label">' + esc(it.text) + '</span>' + badge + '</a>';
        }).join('') + '</div>';
    }).join('');
    document.getElementById('navList').insertAdjacentHTML('beforeend', navHTML);

    /* плитки роли (DashboardColumn → NavTile) */
    var groupsHTML = (window.homePageDashboardItems[role.code] || []).map(function (col) {
      return '<section class="home-group col-3 colw-6"><h2 class="ds-h6-reg">' + esc(col.title) + '</h2>'
        + col.cards.map(function (c) {
          var illu = '<span class="illu ntile__illu" data-illu="' + esc(c.illu) + '" aria-hidden="true"></span>';
          /* NavTile «со ссылками»: контейнер div, кликабельны название и ссылки */
          if (c.links && c.links.length) {
            return '<div class="ntile">' + illu
              + '<a class="ntile__title-link" href="' + esc(c.href || '#') + '"><h3 class="ntile__title">' + esc(c.title) + '</h3></a>'
              + (c.text ? '<p class="ntile__desc">' + esc(c.text) + '</p>' : '')
              + '<nav class="ntile__links" aria-label="Подразделы">'
              + c.links.map(function (l) { return '<a class="link link--accent link--m" href="' + esc(l.href || '#') + '">' + esc(l.text) + '</a>'; }).join('')
              + '</nav></div>';
          }
          return '<a class="ntile" href="' + esc(c.href || '#') + '" data-route="' + esc(c.route || '') + '">'
            + illu
            + '<h3 class="ntile__title">' + esc(c.title) + '</h3>'
            + '<p class="ntile__desc">' + esc(c.text) + '</p></a>';
        }).join('') + '</section>';
    }).join('');
    document.getElementById('homeGroups').insertAdjacentHTML('beforeend', groupsHTML);

    /* пользователь и роль в футере меню */
    var emp = window.currentEmployee || {};
    document.getElementById('userInitials').textContent = emp.initials || '';
    document.getElementById('userName').textContent = [emp.lastName, emp.firstName, emp.middleName].filter(Boolean).join(' ');
    document.getElementById('userRole').textContent = role.title;

    /* окно смены роли (открывает кнопка выхода в футере меню, как в ДС —
       IBPHome.footerHTML(role, { logoutModal })): 4 колонки команд, в каждой — кнопки-ссылки на главную роли;
       текущая роль — недоступная кнопка, команда без ролей — EmptyState */
    window.IBPRoleSwitch.mount(role.code);
  })();
</script>
<script src="../../../ds-body.js"></script>
</body>
</html>
