<!-- Окно дополнительного соглашения (ДС) к договору займа (НКЛ): создание, правка и
     подтверждение удаления. Артефакт тайла «Договор и дополнительные соглашения»
     (страница «Договор и дополнительные соглашения»): окно открывает страница
     PostModalAdditionalAgreement.open({ id?, nextSeqNumber? }) — «Новое соглашение» в шапке
     страницы или карандаш карточки ДС. Фрагмент вшивается ассемблером отдельной меткой
     ds-include в конец страницы, не внутри тайла.

     В файле два соседних скрима (макет «Новое соглашение + редактирование», 26.10.2026):
     1) agreement-scrim — окно «Создание / Редактирование дополнительного соглашения».
        Три состояния макета — одно окно: пустое создание (эталон ниже), заполненное
        создание и правка. Правка отличается заголовком и кнопкой «Удалить» слева в подвале;
        значения полей и заголовок ставит AdditionalAgreementModal.js при каждом открытии
        (значения примеров — в fixtures.json). В разметке — состояние создания: кнопка
        «Удалить» выключена (disabled), её контейнер скрыт атрибутом hidden;
     2) agreement-delete-scrim — подтверждение удаления. Отдельный скрим-сосед: вложенный
        скрим внутри основного унаследовал бы его hidden и не показался бы. Открывается
        поверх основного по «Удалить» (скрим вложенный, --nested), крестик, Esc и
        «Отменить» — без удаления.

     Раскладка полей — как на макете: строка 1 — «Дата подписания», «Номер доп. соглашения»,
     «Тип изменения» (2 : 2 : 5); «Ключевые изменения» и «Комментарий» — на всю ширину;
     блок «Информация о решении КО» — «Дата решения», «Номер решения», «Уровень
     одобрения» (2 : 2 : 5). Ширина окна — modal--w6 (900 px: на макете окно того же
     размера).

     Отличия от макета (решения человека 26.10.2026): подпись «Дата создания» названа
     «Дата подписания» (ответ 5/25); маска даты — ДД.ММ.ГГГГ вместо ММ.ДД.ГГГГ (ответы 7 и 25);
     «Номер решения» — одна строка, а не многострочное поле (ответ 14).

     Списки «Тип изменения», «Ключевые изменения», «Уровень одобрения» пусты в разметке:
     опции собирает скрипт из справочников LOAN_CHANGE_TYPE_LABELS, LOAN_KEY_CHANGE_LABELS,
     LOAN_APPROVAL_LEVEL_LABELS. Крестик очистки в разметке нет намеренно: он живёт по
     значению, его рисует рантайм поля. «Сохранить» и «Удалить» без data-modal-close: окно
     закрывает скрипт, когда проверка прошла. Клик по скриму не закрывает окно с вводом. -->

<div class="modal-scrim" id="agreement-scrim" hidden>
  <div class="modal modal--w6 lc-additional-agreement-modal" data-mode="create" role="dialog" aria-modal="true" aria-labelledby="agreement-title">
    <header class="modal__head">
      <h2 class="modal__title" id="agreement-title">Создание дополнительного соглашения</h2>
      <button type="button" class="ibtn ibtn--neutral ibtn--l" aria-label="Закрыть" data-modal-close><i data-icon="close"></i></button>
    </header>

    <div class="modal__body">
      <div class="lc-additional-agreement-modal__sections">

        <!-- ── Информация о доп. соглашении ─────────────────────────── -->
        <section class="lc-additional-agreement-modal__section" aria-labelledby="agreement-sec-main">
          <h3 class="lc-additional-agreement-modal__heading" id="agreement-sec-main">Информация о доп. соглашении</h3>
          <div class="lc-additional-agreement-modal__grid">

            <div class="inp inp--m inp--fullwidth">
              <label class="ds-label" for="agreement-sign-date"><span class="ds-label__text">Дата подписания</span></label>
              <div class="inp__box">
                <div class="inp__field">
                  <input class="inp__control" id="agreement-sign-date" name="signDate" placeholder="ДД.ММ.ГГГГ" inputmode="numeric" autocomplete="off">
                  <span class="inp__acts">
                    <button type="button" class="inp__act" aria-label="Открыть календарь" aria-haspopup="dialog"><i data-icon="calendar"></i></button>
                  </span>
                </div>
              </div>
            </div>

            <div class="inp inp--m inp--fullwidth">
              <label class="ds-label" for="agreement-seq-number"><span class="ds-label__text">Номер доп. соглашения</span></label>
              <div class="inp__box">
                <div class="inp__field">
                  <input class="inp__control" id="agreement-seq-number" name="seqNumber" inputmode="numeric" autocomplete="off" value="1">
                </div>
              </div>
            </div>

            <div class="inp inp--m inp--fullwidth">
              <label class="ds-label" for="agreement-change-type"><span class="ds-label__text">Тип изменения</span></label>
              <div class="inp__box">
                <div class="inp__field" data-ddl="agreement-change-type-list">
                  <input class="inp__control" id="agreement-change-type" name="changeTypeCode" autocomplete="off">
                  <span class="inp__acts"><button type="button" class="inp__act inp__act--chev" aria-label="Показать список"><i data-icon="chevron-down"></i></button></span>
                </div>
              </div>
              <div id="agreement-change-type-list" class="ddl ddl--floating ddl--scroll" role="listbox"></div>
            </div>

            <div class="inp inp--m inp--fullwidth lc-additional-agreement-modal__wide">
              <label class="ds-label" for="agreement-key-changes"><span class="ds-label__text">Ключевые изменения</span></label>
              <div class="inp__box">
                <div class="inp__field" data-ddl="agreement-key-changes-list">
                  <span class="inp__chips"></span>
                  <input class="inp__control" id="agreement-key-changes" name="keyChangeCodes" autocomplete="off">
                  <span class="inp__acts"><button type="button" class="inp__act inp__act--chev" aria-label="Показать список"><i data-icon="chevron-down"></i></button></span>
                </div>
              </div>
              <div id="agreement-key-changes-list" class="ddl ddl--floating ddl--scroll" role="listbox" aria-multiselectable="true"></div>
            </div>

            <div class="inp inp--m inp--fullwidth inp--multiline lc-additional-agreement-modal__wide">
              <label class="ds-label" for="agreement-comment"><span class="ds-label__text">Комментарий</span></label>
              <div class="inp__field">
                <textarea class="inp__control" id="agreement-comment" name="comment" rows="4"></textarea>
              </div>
            </div>

          </div>
        </section>

        <!-- ── Информация о решении КО ──────────────────────────────── -->
        <section class="lc-additional-agreement-modal__section" aria-labelledby="agreement-sec-decision">
          <h3 class="lc-additional-agreement-modal__heading" id="agreement-sec-decision">Информация о решении КО</h3>
          <div class="lc-additional-agreement-modal__grid">

            <div class="inp inp--m inp--fullwidth">
              <label class="ds-label" for="agreement-decision-date"><span class="ds-label__text">Дата решения</span></label>
              <div class="inp__box">
                <div class="inp__field">
                  <input class="inp__control" id="agreement-decision-date" name="decisionDate" placeholder="ДД.ММ.ГГГГ" inputmode="numeric" autocomplete="off">
                  <span class="inp__acts">
                    <button type="button" class="inp__act" aria-label="Открыть календарь" aria-haspopup="dialog"><i data-icon="calendar"></i></button>
                  </span>
                </div>
              </div>
            </div>

            <div class="inp inp--m inp--fullwidth">
              <label class="ds-label" for="agreement-decision-number"><span class="ds-label__text">Номер решения</span></label>
              <div class="inp__box">
                <div class="inp__field">
                  <input class="inp__control" id="agreement-decision-number" name="decisionNumber" autocomplete="off">
                </div>
              </div>
            </div>

            <div class="inp inp--m inp--fullwidth">
              <label class="ds-label" for="agreement-approval-level"><span class="ds-label__text">Уровень одобрения</span></label>
              <div class="inp__box">
                <div class="inp__field" data-ddl="agreement-approval-level-list">
                  <input class="inp__control" id="agreement-approval-level" name="approvalLevelCode" autocomplete="off">
                  <span class="inp__acts"><button type="button" class="inp__act inp__act--chev" aria-label="Показать список"><i data-icon="chevron-down"></i></button></span>
                </div>
              </div>
              <div id="agreement-approval-level-list" class="ddl ddl--floating ddl--scroll" role="listbox"></div>
            </div>

          </div>
        </section>

      </div>
    </div>

    <footer class="modal__foot">
      <!-- Правка: «Удалить» есть и доступна. Создание: контейнер скрыт, кнопка выключена. -->
      <div class="modal__foot-left" hidden>
        <button type="button" class="btn btn--transparent btn--m" data-agreement-delete disabled><i data-icon="trash"></i><span class="btn__label">Удалить</span></button>
      </div>
      <div class="modal__foot-right">
        <button type="button" class="btn btn--accent btn--m" data-agreement-save><span class="btn__label">Сохранить</span></button>
      </div>
    </footer>
  </div>
</div>

<div class="modal-scrim modal-scrim--nested" id="agreement-delete-scrim" hidden>
  <div class="modal modal--w3" role="alertdialog" aria-modal="true" aria-labelledby="agreement-delete-title">
    <header class="modal__head">
      <h2 class="modal__title" id="agreement-delete-title">Подтвердите действие</h2>
      <button type="button" class="ibtn ibtn--neutral ibtn--l" aria-label="Закрыть" data-modal-close><i data-icon="close"></i></button>
    </header>
    <div class="modal__body">
      <p class="ds-body-m-reg">Удаление дополнительного соглашения</p>
    </div>
    <footer class="modal__foot">
      <div class="modal__foot-right">
        <button type="button" class="btn btn--transparent btn--m" data-agreement-confirm="cancel"><span class="btn__label">Отменить</span></button>
        <button type="button" class="btn btn--accent btn--error btn--m" data-agreement-confirm="ok"><span class="btn__label">Подтвердить</span></button>
      </div>
    </footer>
  </div>
</div>
