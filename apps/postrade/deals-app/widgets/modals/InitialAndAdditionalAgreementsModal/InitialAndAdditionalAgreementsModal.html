<!-- Связанный артефакт тайла «Договор и дополнительные соглашения»: окно «Договор».
     Фрагмент вшивается ассемблером отдельной меткой ds-include — скрим должен
     лежать в конце body, а не внутри тайла.

     Окно только для типа «НКЛ» (макет «Modal_Contract_&_AdditionalAgreement»):
     два поля — «Номер договора» и «Дата подписания». «Плановой даты погашения» в окне
     нет: её берёт готовой тайл (у НКЛ — самая поздняя среди траншей). Окна для других
     типов продуктов не нарисованы и не делаются (решение человека 26.10.2026).

     Значения в разметке — пример. Окно заполняет и сохраняет
     InitialAndAdditionalAgreementsModal.js (PostModalInitialAndAdditionalAgreements):
     на открытии читает LoanAgreementStore.get().contract, «Сохранить» проверяет дату и
     зовёт LoanAgreementStore.setContract. Кнопка без data-modal-close: окно закрывает
     скрипт, когда проверка прошла; с ошибкой окно остаётся открытым. Крестик и Esc
     закрывают без сохранения, клик мимо окна не закрывает (триггеры стоят с
     data-modal-guarded).

     Раскладка: тело окна ДС — колонка с зазором, своего CSS нет; поля — во всю ширину.
     Маска даты — ДД.ММ.ГГГГ (на макете ММ.ДД.ГГГГ — ошибка макета, решение человека
     26.10.2026), календарь и маска — из коробки ДС (InputDate). Крестик очистки в
     разметке нет намеренно: он живёт по значению, его рисует рантайм ds-input.js. -->

<div class="modal-scrim" id="contract-scrim" hidden>
  <div class="modal modal--w3" role="dialog" aria-modal="true" aria-labelledby="contract-title">
    <header class="modal__head">
      <h2 class="modal__title" id="contract-title">Договор</h2>
      <button type="button" class="ibtn ibtn--neutral ibtn--l" aria-label="Закрыть" data-modal-close><i data-icon="close"></i></button>
    </header>

    <div class="modal__body">

      <div class="inp inp--m inp--fullwidth">
        <label class="ds-label" for="contract-number"><span class="ds-label__text">Номер договора</span></label>
        <div class="inp__box">
          <div class="inp__field">
            <input class="inp__control" id="contract-number" name="contractNumber" autocomplete="off" value="1234567890">
          </div>
        </div>
      </div>

      <div class="inp inp--m inp--fullwidth">
        <label class="ds-label" for="contract-sign-date"><span class="ds-label__text">Дата подписания</span></label>
        <div class="inp__box">
          <div class="inp__field">
            <input class="inp__control" id="contract-sign-date" name="contractSignDate" placeholder="ДД.ММ.ГГГГ" inputmode="numeric" autocomplete="off" value="01.01.2021">
            <span class="inp__acts">
              <button type="button" class="inp__act" aria-label="Открыть календарь" aria-haspopup="dialog"><i data-icon="calendar"></i></button>
            </span>
          </div>
        </div>
      </div>

    </div>

    <footer class="modal__foot">
      <div class="modal__foot-right">
        <button type="button" class="btn btn--accent btn--m" data-contract-save><span class="btn__label">Сохранить</span></button>
      </div>
    </footer>
  </div>
</div>
