<!DOCTYPE html>
<html lang="ru">
<head>
<script src="../../../ds-config.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Договор займа (НКЛ) — IBP</title>
<style>
  /* ---------- только раскладка экрана, на токенах ДС ---------- */
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  body { margin: 0; font-family: var(--font-text), system-ui, sans-serif; color: var(--text-primary); background: var(--bg-page); }

  /* Секции страницы: заголовок на фоне страницы, не в тайле (как на странице транша) */
  .in-sec { display: flex; flex-direction: column; gap: var(--space-8); }
  .in-sec__title { margin: 0; font: var(--type-body-m-reg); color: var(--text-secondary); }

  /* Минимальная высота тайла — как на странице сделки и транша */
  .screen__content .tile { min-height: 200px; }

  @container screen (max-width: 1240px) {
    .grid12 > [class*="colw-"] { grid-column: span var(--colw); }
  }
</style>
</head>
<body>

<div class="nav-layout">
  <nav class="nav nav--rail" id="nav" aria-label="Главное меню"></nav>

  <div class="screen">
    <nav class="crumbs" aria-label="Хлебные крошки" data-breadcrumbs>
      <li class="crumbs__item"><a class="link link--muted" href="MainPage.html">Главная</a></li>
      <li class="crumbs__item"><a class="link link--muted" href="Portfolio.html">Текущий портфель ДИД</a></li>
      <li class="crumbs__item"><a class="link link--muted" href="#">Сделка</a></li>
      <li class="crumbs__item crumbs__item--current">
        <span class="crumbs__current" aria-current="page" id="in-crumb">Договор займа</span>
      </li>
    </nav>

    <main class="screen__content">

      <!-- #sec:head ── Шапка страницы: меню ⋮ «Погасить» / «Перенести» -->
      <div class="phead">
        <div class="phead__main">
          <div class="phead__title-row">
            <div class="phead__title-group"><h1 class="phead__title" id="in-title">Договор займа</h1></div>
          </div>
        </div>
        <div class="phead__actions">
          <span class="menu-anchor">
            <button type="button" class="btn btn--outline btn--m btn--icon-only" aria-label="Ещё действия" aria-haspopup="menu" aria-expanded="false" data-menu="in-head-menu" data-menu-align="end"><i data-icon="more-dots"></i></button>
            <div id="in-head-menu" class="menu menu--floating" role="menu" hidden></div>
          </span>
        </div>
      </div>

      <!-- #sec:content ── Общая информация -->
      <section class="in-sec">
        <h2 class="in-sec__title">Общая информация</h2>
        <div class="grid12">
          <ds-include src="../widgets/tiles/CounterpartiesTile/CounterpartiesTile.html" class="col-3 colw-6" id="tile-counterparty" state="loading" mode="edit"></ds-include>
          <ds-include src="../widgets/tiles/BalanceAndCurrencyTile/BalanceAndCurrencyTile.html" class="col-3 colw-6" id="tile-balance-currency" state="loading" mode="edit"></ds-include>
          <ds-include src="../widgets/tiles/InitialAndAdditionalAgreementsTile/InitialAndAdditionalAgreementsTile.html" class="col-6 colw-12" id="tile-contract" state="loading" mode="edit"></ds-include>
          <ds-include src="../widgets/tiles/TransferRateTile/TransferRateTile.html" class="col-3 colw-6" id="tile-transfer-rate" state="loading" mode="edit"></ds-include>
          <ds-include src="../widgets/tiles/LoanExternalDataTile/LoanExternalDataTile.html" class="col-3 colw-6" id="tile-loan-external-data" state="loading" mode="edit"></ds-include>
        </div>
      </section>

      <!-- Транши -->
      <section class="in-sec">
        <h2 class="in-sec__title">Транши</h2>
        <div class="grid12">
          <ds-include src="../widgets/tiles/LoanNrlTranchesTile/LoanNrlTranchesTile.html" class="col-6 colw-12" id="tile-loan-tranches" state="loading" mode="edit"></ds-include>
        </div>
      </section>
    </main>
  </div>
</div>

<!-- #sec:modals ── Окна страницы. Контрагент — окно КНР в режиме инструмента;
     «Погасить», «Перенести» и подтверждение удаления транша слушают событие
     ptreeaction (его шлёт страница); «Документы по сделке» — окно ЭКД сделки. -->
<ds-include src="../widgets/modals/InstrumentsCounterpartiesModal/InstrumentsCounterpartiesModal.html"></ds-include>
<ds-include src="../widgets/modals/InstrumentsCounterpartiesModal/KNRConfirmModal.html"></ds-include>
<ds-include src="../widgets/modals/InstrumentsCounterpartiesModal/CounterpartyCard/CounterpartyCard.html"></ds-include>
<ds-include src="../widgets/modals/BalanceAndCurrencyModal/BalanceAndCurrencyModal.html"></ds-include>
<ds-include src="../widgets/modals/InitialAndAdditionalAgreementsModal/InitialAndAdditionalAgreementsModal.html"></ds-include>
<ds-include src="../widgets/modals/LoanExternalDataModal/LoanExternalDataModal.html"></ds-include>
<ds-include src="../widgets/modals/CounterpartiesEcmModal/CounterpartiesEcmModal.html"></ds-include>
<ds-include src="../widgets/modals/CounterpartiesEcmModal/EcmModal/EcmModal.html"></ds-include>
<ds-include src="../widgets/modals/RepaymentModal/RepaymentModal.html"></ds-include>
<ds-include src="../widgets/modals/InstrumentTransferModal/InstrumentTransferModal.html"></ds-include>
<ds-include src="../widgets/modals/ProductTreeConfirmModal/ProductTreeConfirmModal.html"></ds-include>

<script src="../data/mock-deals.js"></script>
<script src="../data/deal-status-model.js"></script>
<script src="../data/deals-store.js"></script>
<script src="../data/mock-counterparties.js"></script>
<script src="../data/post-api.js"></script>
<script src="../data/counterparties-store.js"></script>
<script src="../data/mock-product-catalog.js"></script>
<script src="../data/mock-fin-instruments.js"></script>
<script src="../data/mock-deal-trees.js"></script>
<script src="../data/product-tree-store.js"></script>
<script src="../data/mock-loan-agreements.js"></script>
<script src="../data/loan-agreement-store.js"></script>
<script src="../data/tranche-context.js"></script>
<script src="../data/instrument-context.js"></script>
<script src="../data/loan-contract-fields.js"></script>
<script src="../../../ds-body.js" data-ds="patterns/HomeRoles/ibp-home.js"></script>
<script src="../widgets/modals/InstrumentsCounterpartiesModal/CounterpartyCard/CounterpartyCard.js"></script>
<script src="../widgets/modals/InstrumentsCounterpartiesModal/InstrumentsCounterpartiesModal.js"></script>
<script src="../widgets/tiles/CounterpartiesTile/CounterpartiesTile.js"></script>
<script src="../widgets/modals/BalanceAndCurrencyModal/BalanceAndCurrencyModal.js"></script>
<script src="../widgets/tiles/BalanceAndCurrencyTile/BalanceAndCurrencyTile.js"></script>
<script src="../widgets/modals/InitialAndAdditionalAgreementsModal/InitialAndAdditionalAgreementsModal.js"></script>
<script src="../widgets/tiles/InitialAndAdditionalAgreementsTile/InitialAndAdditionalAgreementsTile.js"></script>
<script src="../widgets/modals/LoanExternalDataModal/LoanExternalDataModal.js"></script>
<script src="../widgets/tiles/LoanExternalDataTile/LoanExternalDataTile.js"></script>
<script src="../widgets/tiles/TransferRateTile/TransferRateTile.js"></script>
<script src="../widgets/tiles/LoanNrlTranchesTile/LoanNrlTranchesTile.js"></script>
<script src="../widgets/modals/CounterpartiesEcmModal/CounterpartiesEcmModal.js"></script>
<script src="../widgets/modals/ProductTreeConfirmModal/ProductTreeConfirmModal.js"></script>
<script src="../widgets/modals/RepaymentModal/RepaymentModal.js"></script>
<script src="../widgets/modals/InstrumentTransferModal/InstrumentTransferModal.js"></script>
<script>
/* Экранный скрипт: меню по каталогу ролей, тайлы и окна страницы договора займа.
   Данные — LoanAgreementStore (запись договора) и ProductTreeStore (транши, погашение,
   перенос); режим правки — LoanAgreementStore.isEditable(): статус сделки и погашение
   договора. Адрес: Instrument.html?id=<сделка>&ins=<id узла договора>. */
(function () {
  'use strict';
  var role = window.IBPHome.defaultRole;
  var SELECTED_ID = 'current-portfolio';
  var USER_LINK_FROM = ' href="#" aria-label="Открыть личный кабинет"';
  var USER_LINK_TO = ' href="../../../../index.html" aria-label="Хаб проектов"';

  function ic(name) { return '<i data-icon="' + name + '"></i>'; }

  function itemHTML(it) {
    var sel = (it.id === SELECTED_ID) ? ' nav__item--selected" aria-current="page' : '';
    return '<a class="nav__item' + sel + '" href="#"><span class="nav__ico">' + ic(it.icon) + '</span>'
      + '<span class="nav__label">' + it.label + '</span></a>';
  }

  function buildNav() {
    var nav = document.getElementById('nav');
    var s = '<div class="nav__top">'
      + '<button type="button" class="ibtn ibtn--neutral ibtn--m nav__burger" aria-label="Свернуть меню">' + ic('left-menu') + '</button>'
      + '<button type="button" class="ibtn ibtn--neutral ibtn--m nav__pin" aria-pressed="false" aria-label="Закрепить панель">' + ic('pin-menu') + '</button>'
      + '</div><div class="nav__list">'
      + '<a class="nav__item" href="MainPage.html"><span class="nav__ico">' + ic('main-page') + '</span><span class="nav__label">Главная</span></a>';
    IBPHome.itemsFor(role).forEach(function (g, i) {
      s += '<div class="nav__block' + (i === 0 ? ' nav__block--first' : '') + '"><div class="nav__block-label">' + g.label + '</div>';
      g.items.forEach(function (it) { s += itemHTML(it); });
      s += '</div>';
    });
    s += '</div>' + (window.IBPHome && window.IBPHome.footerHTML
      ? window.IBPHome.footerHTML(role).replace(USER_LINK_FROM, USER_LINK_TO)
      : '<div class="nav__footer">'
        + '<a class="nav__user" href="../../../../index.html" aria-label="Хаб проектов">'
        + '<span class="av av--circular av--m"><span class="av__text">АП</span></span>'
        + '<span class="nav__user-text"><span class="nav__user-name">Александров Пётр</span>'
        + '<span class="nav__user-role">' + role + '</span></span></a>'
        + '<button type="button" class="ibtn ibtn--neutral ibtn--m nav__logout" aria-label="Выйти">' + ic('logout') + '</button>'
        + '</div>');
    nav.innerHTML = s;
    if (window.DSNavPanel) window.DSNavPanel.bind(nav);
  }

  var LAS = window.LoanAgreementStore;
  var trees = window.ProductTreeStore;
  var cps = window.CounterpartiesStore;
  var ctx = null;

  /* Страницы собирает ассемблер: соседние — Deal.preview.html и т. п. */
  var isPreview = /\.preview\.html$/.test(window.location.pathname);
  function sibling(name) { return name + (isPreview ? '.preview.html' : '.html'); }

  function $(id) { return document.getElementById(id); }

  /* Транши для тайла: вторая строка дерева — дата подписания и сумма лимита, как в «Продуктах сделки» */
  function trancheViews() {
    return LAS.tranches().map(function (t) {
      var date = null, amount = null, cur = 'RUB';
      (t.details || []).forEach(function (d) {
        if (d.field === 'signedAt') date = d.value || null;
        else { amount = d.value == null ? null : d.value; if (d.currency) cur = d.currency; }
      });
      /* «Удалить» недоступно, если транш прикреплён к ФИ (ProductTreeStore.canRemove) */
      return { id: t.id, number: t.number, name: t.name, repaid: !!t.repaidAt, repaidAt: t.repaidAt || null,
               dateISO: date, amount: amount, currencyCode: cur, canRemove: trees.canRemove(t.id) };
    });
  }

  function paintHead() {
    var node = LAS.instrument();
    var label = node ? node.number + ' ' + node.name : ctx.instrumentLabel;
    $('in-title').textContent = label;
    document.title = label + ' — IBP';
    window.InstrumentContext.paintCrumbs(document.querySelector('[data-breadcrumbs]'), [
      null, { href: 'Portfolio.html' }, { text: ctx.dealLabel, href: sibling('Deal') + ctx.dealQuery }, { text: label }
    ]);
    /* меню ⋮: «Погасить» (у погашенного — «Отменить погашение») и «Перенести»;
       когда статус сделки не допускает правку — выключены разметкой */
    var editable = window.DealsStore.isEditable(ctx.deal);
    var items = (node && node.menu ? node.menu : []).filter(function (m) { return m.action !== 'DELETE'; });
    $('in-head-menu').innerHTML = items.map(function (m) {
      return '<button type="button" class="menu__item" role="menuitem" data-in-act="' + m.action + '"'
        + (editable ? '' : ' disabled aria-disabled="true"') + '><span class="menu__item-label">' + m.label + '</span></button>';
    }).join('');
  }

  function setMode(el, mode) { if (el) el.setAttribute('data-mode', mode); }

  function paint() {
    if (!ctx) return;
    var mode = LAS.isEditable() ? 'edit' : 'view';
    var rec = LAS.get();
    paintHead();

    var knr = $('tile-counterparty');
    setMode(knr, mode);
    setMode(document.querySelector('.lc-knrm'), mode);
    window.PostTileKNR.setVariant(knr, 'instrument');
    window.PostTileKNR.renderInstrument(knr, LAS.counterparty());
    window.PostModalCounterparties.use({ variant: 'instrument', counterpartyId: rec.counterpartyId, onSave: function () {} });

    window.PostTileBalanceAndCurrency.render($('tile-balance-currency'), { mode: mode, data: rec.balanceCurrency });

    var last = LAS.lastAgreement();
    window.PostTileInitialAndAdditionalAgreements.render($('tile-contract'), {
      mode: mode, variant: 'loan-ncl', data: rec.contract,
      plannedRepaymentDate: LAS.plannedRepaymentDate(),
      lastAgreement: last, lastAgreementNumber: last ? LAS.agreementNumber(last) : null
    });

    window.PostTileTransferRate.render($('tile-transfer-rate'), { mode: mode, rate: LAS.currentRate() });
    window.PostTileLoanExternalData.render($('tile-loan-external-data'), { mode: mode, data: rec.techInfo });
    window.PostTileLoanNrlTranches.render($('tile-loan-tranches'), { mode: mode, tranches: trancheViews() });

    if (window.dsIcons) window.dsIcons.apply(document);
    if (window.DSMenu && window.DSMenu.bindAll) window.DSMenu.bindAll(document);
  }

  /* Погашение, перенос и удаление — окна дерева продуктов, они слушают 'ptreeaction' */
  function emitTree(action, id) {
    document.dispatchEvent(new CustomEvent('ptreeaction', { detail: { action: action, id: id, node: trees.node(id) } }));
  }

  /* Действия тайлов: тайл шлёт 'loanaction', что делать — знает страница. */
  document.addEventListener('loanaction', function (e) {
    var d = e.detail || {};
    if (!ctx) return;
    switch (d.action) {
      case 'DOCS':
        /* Кнопка открывает окно программно, без data-modal, — слушатель клика
           CounterpartiesEcmModal не срабатывает. Refresh до открытия: карточки
           участников встают в окно до того, как рантайм поставит в них фокус. */
        if (window.DSModal && $('deal-ecm-scrim')) {
          if ($('deal-ecm-scrim').__dealEcmApi) $('deal-ecm-scrim').__dealEcmApi.refresh();
          window.DSModal.open($('deal-ecm-scrim'));
        }
        break;
      case 'OPEN_CONTRACT': window.location.href = sibling('InitialAndAdditionalAgreements') + ctx.instrumentQuery; break;
      case 'OPEN_ETS': window.location.href = sibling('TransferSchemas') + ctx.instrumentQuery; break;
      case 'OPEN_TRANCHE': window.location.href = 'Tranche.preview.html' + ctx.trancheQuery(d.id); break;
      case 'ADD_TRANCHE':
        /* транш сразу, без окна — как ⊕ у договора займа в «Продуктах сделки» */
        if (trees.addTranche(ctx.instrument.id)) trees.commit();
        break;
      case 'REPAY_TRANCHE': emitTree('REPAY', d.id); break;
      case 'UNDO_REPAY_TRANCHE': emitTree('UNDO_REPAY', d.id); break;
      case 'DELETE_TRANCHE': emitTree('DELETE', d.id); break;
    }
  });

  /* Меню ⋮ шапки: пункты рантайм держит в общем слое, ловим по атрибуту */
  document.addEventListener('click', function (e) {
    var el = e.target.closest && e.target.closest('[data-in-act]');
    if (!el || el.disabled || !ctx) return;
    emitTree(el.getAttribute('data-in-act'), ctx.instrument.id);
  });

  function init() {
    ctx = window.InstrumentContext.resolve(window.location.search);
    if (!ctx) {
      $('in-title').textContent = 'Договор займа не найден';
      return null;
    }
    return cps.use(ctx.openedId).then(function () {
      LAS.use(ctx.openedId, ctx.instrument.id);
      if (window.PostDealEcmModal) {
        window.PostDealEcmModal.bind($('deal-ecm-scrim'), $('deal-ecm-docs-scrim'), {
          members: function () { return String(cps.dealId()) === String(ctx.openedId) ? cps.members() : null; }
        });
      }
      /* перерисовка: запись договора, дерево (транши, погашение, перенос), статус сделки */
      LAS.on('change', paint);
      trees.on('commit', paint);
      window.DealsStore.on('change', paint);
      paint();
    });
  }

  buildNav();
  /* Окно «Техническая информация» биндит страница (стор по умолчанию):
     самобинда у окна нет — страница транша биндит его со своим источником. */
  if (window.PostModalLoanExternalData) window.PostModalLoanExternalData.bind();
  /* заголовок тайла «Контрагент» — до загрузки данных, иначе пока они грузятся он зовётся «КНР» */
  if (window.PostTileKNR && $('tile-counterparty')) window.PostTileKNR.setVariant($('tile-counterparty'), 'instrument');
  Promise.all([trees.ready, LAS.ready, cps.ready]).then(init);
  if (window.dsIcons) window.dsIcons.apply(document);
})();
</script>
</body>
</html>
