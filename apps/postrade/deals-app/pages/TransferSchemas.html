<!DOCTYPE html>
<html lang="ru">
<head>
<script src="../../../ds-config.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Единая трансфертная ставка — IBP</title>
<style>
  /* ---------- только раскладка экрана, на токенах ДС ---------- */
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  body { margin: 0; font-family: var(--font-text), system-ui, sans-serif; color: var(--text-primary); background: var(--bg-page); }

  /* Пустое состояние — по центру свободной области под шапкой, как на макете */
  .ets-empty { display: flex; justify-content: center; padding-top: var(--space-64); }
</style>
</head>
<body>

<div class="nav-layout">
  <nav class="nav nav--rail" id="nav" aria-label="Главное меню"></nav>

  <div class="screen">
    <nav class="crumbs" aria-label="Хлебные крошки" data-breadcrumbs>
      <li class="crumbs__item"><a class="link link--muted" href="MainPage.html">Главная</a></li>
      <li class="crumbs__item"><a class="link link--muted" href="Portfolio.html">Текущий портфель ДИД</a></li>
      <li class="crumbs__item"><a class="link link--muted" href="#">Сделка</a></li>
      <li class="crumbs__item"><a class="link link--muted" href="#">Договор займа</a></li>
      <li class="crumbs__item crumbs__item--current">
        <span class="crumbs__current" aria-current="page">Единая трансфертная ставка</span>
      </li>
    </nav>

    <main class="screen__content">

      <!-- #sec:head ── Шапка: «В инструмент» — обратно на страницу договора займа; «Новая схема» в
           просмотре выключена разметкой; меню ⋮ с историями доступно и в просмотре (справка) -->
      <div class="phead">
        <div class="phead__main">
          <div class="phead__title-row">
            <div class="phead__title-group"><h1 class="phead__title">Единая трансфертная ставка</h1></div>
            <span class="phead__return">
              <button type="button" class="btn btn--outline btn--xs" id="ets-back-btn"><i data-icon="flip-backward"></i><span class="btn__label">В инструмент</span></button>
            </span>
          </div>
        </div>
        <div class="phead__actions">
          <button type="button" class="btn btn--accent btn--m" id="ets-new-btn" data-ets-act="NEW"><i data-icon="add"></i><span class="btn__label">Новая схема</span></button>
          <span class="menu-anchor">
            <button type="button" class="btn btn--outline btn--m btn--icon-only" aria-label="Ещё действия" aria-haspopup="menu" aria-expanded="false" data-menu="ets-head-menu" data-menu-align="end"><i data-icon="more-dots"></i></button>
            <div id="ets-head-menu" class="menu menu--floating" role="menu" hidden>
              <button type="button" class="menu__item" role="menuitem" data-ets-act="HISTORY_BASE_INDEX"><span class="menu__item-label">История БИ</span></button>
              <button type="button" class="menu__item" role="menuitem" data-ets-act="HISTORY_RATE"><span class="menu__item-label">История ставок</span></button>
            </div>
          </span>
        </div>
      </div>

      <!-- #sec:content ── Карточки процентных схем стопкой; без схем — пустое состояние -->
      <div class="grid12">
        <ds-include src="../widgets/tiles/TransferSchemaTile/TransferSchemaTile.html" class="col-12" id="ets-list" hidden></ds-include>
      </div>

      <!-- пусто: схем у договора нет. Кнопку рисует скрипт страницы только при праве на правку —
           в просмотре её нет в разметке (Л235) -->
      <div class="ets-empty" id="ets-empty-wrap" hidden>
        <div class="es es--l" id="ets-empty" role="status" aria-live="polite">
          <span class="illu es__illu" data-illu="empty-folder" aria-hidden="true"></span>
          <div class="es__body">
            <p class="es__title">Здесь пока ничего нет</p>
          </div>
          <div class="es__actions" id="ets-empty-actions"></div>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- #sec:modals ── Окна страницы. Схему и подтверждение удаления открывает страница вызовом
     PostModalTransferSchema.open / .confirmRemove, истории — PostModalTransferRateHistory.open
     и PostModalBaseTransferIndexHistory.open из меню ⋮ шапки. -->
<ds-include src="../widgets/modals/TransferSchemaModal/TransferSchemaModal.html"></ds-include>
<ds-include src="../widgets/modals/TransferRateHistoryModal/TransferRateHistoryModal.html"></ds-include>
<ds-include src="../widgets/modals/BaseTransferIndexHistoryModal/BaseTransferIndexHistoryModal.html"></ds-include>

<script src="../data/mock-deals.js"></script>
<script src="../data/deal-status-model.js"></script>
<script src="../data/deals-store.js"></script>
<script src="../data/mock-counterparties.js"></script>
<script src="../data/post-api.js"></script>
<script src="../data/counterparties-store.js"></script>
<script src="../data/mock-product-catalog.js"></script>
<script src="../data/mock-fin-instruments.js"></script>
<script src="../data/mock-deal-trees.js"></script>
<script src="../data/product-tree-store.js"></script>
<script src="../data/mock-loan-agreements.js"></script>
<script src="../data/loan-agreement-store.js"></script>
<script src="../data/tranche-context.js"></script>
<script src="../data/instrument-context.js"></script>
<script src="../../../ds-body.js" data-ds="patterns/HomeRoles/ibp-home.js"></script>
<script src="../widgets/tiles/TransferSchemaTile/TransferSchemaTile.js"></script>
<script src="../widgets/modals/TransferSchemaModal/TransferSchemaModal.js"></script>
<script src="../widgets/modals/TransferRateHistoryModal/TransferRateHistoryModal.js"></script>
<script src="../widgets/modals/BaseTransferIndexHistoryModal/BaseTransferIndexHistoryModal.js"></script>
<script>
/* Экранный скрипт: меню по каталогу ролей, список процентных схем ЕТС, пустое состояние, окна схемы
   и историй, тосты. Данные — LoanAgreementStore (запись договора); режим правки —
   LoanAgreementStore.isEditable(): статус сделки и погашение договора.
   Адрес: TransferSchemas.html?id=<сделка>&ins=<id узла договора>. */
(function () {
  'use strict';
  var role = window.IBPHome.defaultRole;
  var SELECTED_ID = 'current-portfolio';
  var USER_LINK_FROM = ' href="#" aria-label="Открыть личный кабинет"';
  var USER_LINK_TO = ' href="../../../../index.html" aria-label="Хаб проектов"';

  function ic(name) { return '<i data-icon="' + name + '"></i>'; }

  function itemHTML(it) {
    var sel = (it.id === SELECTED_ID) ? ' nav__item--selected" aria-current="page' : '';
    return '<a class="nav__item' + sel + '" href="#"><span class="nav__ico">' + ic(it.icon) + '</span>'
      + '<span class="nav__label">' + it.label + '</span></a>';
  }

  function buildNav() {
    var nav = document.getElementById('nav');
    var s = '<div class="nav__top">'
      + '<button type="button" class="ibtn ibtn--neutral ibtn--m nav__burger" aria-label="Свернуть меню">' + ic('left-menu') + '</button>'
      + '<button type="button" class="ibtn ibtn--neutral ibtn--m nav__pin" aria-pressed="false" aria-label="Закрепить панель">' + ic('pin-menu') + '</button>'
      + '</div><div class="nav__list">'
      + '<a class="nav__item" href="MainPage.html"><span class="nav__ico">' + ic('main-page') + '</span><span class="nav__label">Главная</span></a>';
    IBPHome.itemsFor(role).forEach(function (g, i) {
      s += '<div class="nav__block' + (i === 0 ? ' nav__block--first' : '') + '"><div class="nav__block-label">' + g.label + '</div>';
      g.items.forEach(function (it) { s += itemHTML(it); });
      s += '</div>';
    });
    s += '</div>' + (window.IBPHome && window.IBPHome.footerHTML
      ? window.IBPHome.footerHTML(role).replace(USER_LINK_FROM, USER_LINK_TO)
      : '<div class="nav__footer">'
        + '<a class="nav__user" href="../../../../index.html" aria-label="Хаб проектов">'
        + '<span class="av av--circular av--m"><span class="av__text">АП</span></span>'
        + '<span class="nav__user-text"><span class="nav__user-name">Александров Пётр</span>'
        + '<span class="nav__user-role">' + role + '</span></span></a>'
        + '<button type="button" class="ibtn ibtn--neutral ibtn--m nav__logout" aria-label="Выйти">' + ic('logout') + '</button>'
        + '</div>');
    nav.innerHTML = s;
    if (window.DSNavPanel) window.DSNavPanel.bind(nav);
  }

  var LAS = window.LoanAgreementStore;
  var cps = window.CounterpartiesStore;
  var ctx = null;

  /* Страницы собирает ассемблер: соседние — Instrument.preview.html и т. п. */
  var isPreview = /\.preview\.html$/.test(window.location.pathname);
  function sibling(name) { return name + (isPreview ? '.preview.html' : '.html'); }

  function $(id) { return document.getElementById(id); }
  function show(el, on) { if (el) el.hidden = !on; }

  var TOASTS = {
    add: 'Новая процентная схема добавлена',
    update: 'Процентная схема изменена',
    remove: 'Процентная схема удалена'
  };

  function paintHead(editable) {
    var node = LAS.instrument();
    var label = node ? node.number + ' ' + node.name : ctx.instrumentLabel;
    document.title = 'Единая трансфертная ставка — IBP';
    window.InstrumentContext.paintCrumbs(document.querySelector('[data-breadcrumbs]'), [
      null, { href: 'Portfolio.html' }, { text: ctx.dealLabel, href: sibling('Deal') + ctx.dealQuery },
      { text: label, href: sibling('Instrument') + ctx.instrumentQuery }, null
    ]);
    /* «Новая схема» в шапке в просмотре выключена разметкой */
    var btn = $('ets-new-btn');
    btn.disabled = !editable;
    if (editable) btn.removeAttribute('aria-disabled'); else btn.setAttribute('aria-disabled', 'true');
  }

  function paint() {
    if (!ctx) return;
    var editable = LAS.isEditable();
    var mode = editable ? 'edit' : 'view';
    var items = LAS.schemes();
    paintHead(editable);

    window.PostTileTransferSchema.renderList($('ets-list'), { mode: mode, items: items });
    show($('ets-list'), items.length > 0);

    show($('ets-empty-wrap'), items.length === 0);
    /* кнопки «Новая схема» в пустом состоянии в просмотре нет в разметке */
    $('ets-empty-actions').innerHTML = editable
      ? '<button type="button" class="btn btn--accent btn--m" data-ets-act="NEW"><i data-icon="add"></i><span class="btn__label">Новая схема</span></button>'
      : '';
    show($('ets-empty-actions'), editable);

    if (window.dsIcons) window.dsIcons.apply(document);
    if (window.DSMenu && window.DSMenu.bindAll) window.DSMenu.bindAll(document);
  }

  function openScheme(id) {
    if (!LAS.isEditable() || !window.PostModalTransferSchema) return;
    window.PostModalTransferSchema.open(id ? { id: id } : {});
  }

  /* Действия тайла: карточка шлёт 'loanaction', что делать — знает страница. */
  document.addEventListener('loanaction', function (e) {
    var d = e.detail || {};
    if (!ctx) return;
    switch (d.action) {
      case 'EDIT_SCHEME': openScheme(d.id); break;
      case 'REMOVE_SCHEME':
        if (LAS.isEditable() && window.PostModalTransferSchema) window.PostModalTransferSchema.confirmRemove(d.id);
        break;
    }
  });

  /* «Новая схема» (шапка и пустое состояние), пункты меню ⋮ шапки */
  document.addEventListener('click', function (e) {
    var el = e.target.closest && e.target.closest('[data-ets-act]');
    if (!el || el.disabled || !ctx) return;
    switch (el.getAttribute('data-ets-act')) {
      case 'NEW': openScheme(null); break;
      case 'HISTORY_RATE':
        if (window.PostModalTransferRateHistory) window.PostModalTransferRateHistory.open();
        break;
      case 'HISTORY_BASE_INDEX':
        if (window.PostModalBaseTransferIndexHistory) window.PostModalBaseTransferIndexHistory.open();
        break;
    }
  });

  /* Окно схемы сохранило или удалило схему — тост */
  document.addEventListener('transferschemasaved', function (e) {
    var d = e.detail || {};
    if (window.DSToast && TOASTS[d.kind]) window.DSToast.show({ message: TOASTS[d.kind], kind: 'bar', tone: 'success' });
  });

  $('ets-back-btn').addEventListener('click', function () {
    if (ctx) window.location.href = sibling('Instrument') + ctx.instrumentQuery;
  });

  function init() {
    ctx = window.InstrumentContext.resolve(window.location.search);
    if (!ctx) {
      document.querySelector('.phead__title').textContent = 'Договор займа не найден';
      return null;
    }
    return cps.use(ctx.openedId).then(function () {
      LAS.use(ctx.openedId, ctx.instrument.id);
      /* перерисовка: запись договора (схемы), статус сделки */
      LAS.on('change', paint);
      window.DealsStore.on('change', paint);
      paint();
    });
  }

  buildNav();
  Promise.all([window.ProductTreeStore.ready, LAS.ready, cps.ready]).then(init);
  if (window.dsIcons) window.dsIcons.apply(document);
})();
</script>
</body>
</html>
