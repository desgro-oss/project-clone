# Сценарии показа прототипа Post — Корректировки РСБУ v4 — панель прототипа.
# Формат — .agents/proto-panel/README.md, раздел «flows.yaml».
# После правки: node .agents/tools/proto-panel.mjs (пересобрать зеркало).
# Основа — сценарии концепта v3 (RE0034, RE0035 Э4); v4 — фиксация на транше, 28.10.2026.
# Номера состояний постоянны (урок Л255): шаги, что остались от v3, держат свои номера;
# номера убранных шагов (12, 14–53 кроме оставшихся) повторно не выдаются, новые — с 54.
version: 1
lastState: 70
flows:
  - id: main
    title: Основной путь — руками
    desc: Сделка → транш (зафиксировать РСБУ, пересчитать платежи) → корректировки → метрики (пересчёт) → отчёт РСБУ. Готовых состояний в адресе нет, старт — с чистого.
    steps:
      - state: 1
        id: start
        title: Страница сделки — чистый старт
        page: Deal.preview.html?id=1028&rasReset=1
        note: 'Старт: человек сам открывает страницу сделки по этому адресу — он сбрасывает сохранённые фиксацию РСБУ, корректировки и пересчёт платежей этой сделки и убирает параметр, поэтому обновление страницы ход прохождения не стирает. Дальше человек сам открывает транш по названию в дереве продуктов.'
      - state: 3
        id: main-tranche
        title: Транш — тайл «Процентные платежи»
        page: Tranche.preview.html?id=1028&tr=1028.d1.p1.i1.t1
        note: На тайле «Процентные платежи» — «Зафиксировать РСБУ» и «Пересчитать платежи»; тайл «Корректировки процентов РСБУ» — «Корректировки отсутствуют». Человек сам жмёт «Зафиксировать РСБУ», вводит дату фиксации (например, 31.03.2025 — закрыт март) — дата корректировки сама становится 01.04.2025 — и жмёт «Сохранить».
      - state: 54
        id: main-pay-fixed
        title: Фиксация РСБУ сохранена
        page: Tranche.preview.html?id=1028&tr=1028.d1.p1.i1.t1
        note: 'На тайле «Процентные платежи» — «Дата фиксации РСБУ: 31.03.2025», снек «Фиксация РСБУ сохранена». Изменения транша вносятся за кадром. Дальше человек сам жмёт «Пересчитать платежи».'
      - state: 55
        id: main-recalculated
        title: Платежи пересчитаны — корректировки созданы
        page: Tranche.preview.html?id=1028&tr=1028.d1.p1.i1.t1
        note: 'Снек «Платежи пересчитаны. Создано корректировок РСБУ: 2», отметка о фиксации погасла (фиксация снята), тайл корректировок — «Внесено корректировок: 2». Дальше человек сам открывает тайл корректировок стрелкой.'
      - state: 4
        id: main-adjustments
        title: Корректировки — строки из дельт
        page: RsbuInterestAdjustments.preview.html?id=1028&tr=1028.d1.p1.i1.t1
        note: 'Две строки: исходные даты 31.12.2024 и 31.03.2025, целевая — 01.04.2025; сумма корректировки — сумма шести видов процентов. Человек сам может внести ручную корректировку («Внести корректировку», шесть сумм) или удалить строку.'
      - state: 56
        id: main-manual
        title: Ручная корректировка внесена
        page: RsbuInterestAdjustments.preview.html?id=1028&tr=1028.d1.p1.i1.t1
        note: Строка ручной корректировки в таблице, тост «Корректировка добавлена». Дальше человек сам идёт «В транш», оттуда в сделку и «Отчеты →» на тайле метрик.
      - state: 2
        id: main-metrics
        title: Финансовые метрики · РСБУ до пересчёта
        page: FinancialMetrics.preview.html?id=1028
        note: 'Вкладка РСБУ: отчёт ещё прежний — корректировки входят в отчёт при пересчёте метрик. Человек сам жмёт «Пересчет метрик» (вкладку выбирать не обязательно).'
        do:
          - click: '#tab-ras'
          - waitFor: '#panel-ras:not([hidden])'
      - state: 57
        id: main-report-mark
        title: Отчёт РСБУ после пересчёта
        page: FinancialMetrics.preview.html?id=1028
        note: После пересчёта у ФИ «128-Кредит-202» в строке «Начисленные проценты за период» колонка 01.04.2025 — жёлтая ячейка с меткой, тултип «Внесена корректировка процентов РСБУ на сумму +… RUB». Закрытые даты по 31.03.2025 — как при закрытии, будущие — новый расчёт. Повторный пересчёт закрытые даты не меняет.
        do:
          - click: '#tab-ras'
          - waitFor: '#panel-ras:not([hidden])'

  - id: ras-e2e
    title: 'Автопоказ: весь сценарий'
    desc: 'Готовый путь для показа и снимков: панель сама нажимает кнопки от страницы сделки до отметки в отчёте РСБУ (сделка 1028, «Ввод изменений»); начинается с чистого состояния'
    steps:
      - state: 58
        id: e2e4-deal
        title: Страница сделки
        page: Deal.preview.html?id=1028&rasReset=1
        note: Март закрыт, данные ушли в 1С; данные за март пришли позже. Дальше — транш.
      - state: 59
        id: e2e-fix-modal
        title: Окно «Фиксация РСБУ»
        page: Tranche.preview.html?id=1028&tr=1028.d1.p1.i1.t1&rasFix=none&rasAdj=none
        note: «Зафиксировать РСБУ» на тайле «Процентные платежи». Дата фиксации 31.03.2025 — значения начисленных процентов фиксируются с первой даты отчёта по неё; дата корректировки подставилась сама — 01.04.2025.
        do:
          - click: '#ip-fix'
          - waitFor: '#rsbu-fix-scrim:not([hidden])'
          - fill:
              target: '#rsbu-fix-date'
              value: 31.03.2025
      - state: 60
        id: e2e-fixed
        title: Фиксация сохранена
        note: '«Сохранить» — на тайле «Дата фиксации РСБУ: 31.03.2025».'
        do:
          - click: '[data-rsbu-fix-submit]'
          - waitFor: '[data-rsbu-fixed]:not([hidden])'
      - state: 61
        id: e2e4-recalc
        title: Пересчёт платежей — корректировки созданы
        note: '«Пересчитать платежи»: дельты зафиксированных дат стали корректировками на 01.04.2025, фиксация снята, тайл корректировок — «Внесено корректировок: 2».'
        do:
          - click: '#ip-recalc'
          - waitFor:
              target: '[data-rsbu-fixed]'
              state: hidden
              timeout: 8000
      - state: 62
        id: e2e-adjustments
        title: Страница корректировок
        page: RsbuInterestAdjustments.preview.html?id=1028&tr=1028.d1.p1.i1.t1&rasAdj=created
        note: Строка на каждую дату с дельтой; шесть видов процентов и их сумма.
      - state: 63
        id: e2e-manual-modal
        title: Окно ручной корректировки
        note: '«Внести корректировку»: шесть сумм в три ряда по две колонки, «Сумма корректировки» считается при вводе.'
        do:
          - click: '#rh-add'
          - waitFor: '#rsbu-adj-scrim:not([hidden])'
          - fill:
              target: '#rsbu-adj-start'
              value: 30.09.2024
          - fill:
              target: '#rsbu-adj-end'
              value: 01.04.2025
          - fill:
              target: '#rsbu-adj-p1'
              value: '10000'
          - fill:
              target: '#rsbu-adj-p2'
              value: '2500'
      - state: 64
        id: e2e-manual-saved
        title: Ручная корректировка внесена
        note: «Добавить» — строка в таблице, тост «Корректировка добавлена».
        do:
          - click: '[data-rsbu-submit]'
          - waitFor:
              target: '#rsbu-adj-scrim'
              state: hidden
      - state: 65
        id: e2e4-report
        title: Пересчёт метрик — отметка в отчёте РСБУ
        page: FinancialMetrics.preview.html?id=1028&rasAdj=created
        note: '«Пересчет метрик»: в строке «Начисленные проценты за период» колонка 01.04.2025 — жёлтая ячейка, тултип «Внесена корректировка процентов РСБУ на сумму +… RUB»; закрытые даты — как при закрытии.'
        do:
          - click: '#tab-ras'
          - waitFor: '#panel-ras:not([hidden]) [data-node]'
          - click: '#fm-calc'
          - waitFor:
              target: '#panel-ras [data-fm-adjusted]'
              timeout: 8000

  - id: rsbu-payments
    title: Показ тайла «Процентные платежи»
    desc: Готовые виды тайла и окна «Фиксация РСБУ» — адресом, для показа и снимков
    steps:
      - state: 66
        id: pay-none
        title: Фиксации нет
        page: Tranche.preview.html?id=1028&tr=1028.d1.p1.i1.t1&rasFix=none&rasAdj=none
        note: «Заполнено», кнопки «Зафиксировать РСБУ» и «Пересчитать платежи».
      - state: 67
        id: pay-modal
        title: Окно «Фиксация РСБУ»
        page: Tranche.preview.html?id=1028&tr=1028.d1.p1.i1.t1&rasFix=none&rasAdj=none&open=fix
        note: Две даты с календарём; дата корректировки по умолчанию — первое число месяца после даты фиксации.
        do:
          - waitFor: '#rsbu-fix-scrim:not([hidden])'
      - state: 68
        id: pay-modal-error
        title: Ошибка — дата корректировки не позже фиксации
        page: Tranche.preview.html?id=1028&tr=1028.d1.p1.i1.t1&rasFix=none&rasAdj=none&open=fix
        note: Дата корректировки должна быть позже даты фиксации — Alert вверху окна, поле красное.
        do:
          - waitFor: '#rsbu-fix-scrim:not([hidden])'
          - fill:
              target: '#rsbu-fix-date'
              value: 31.03.2025
          - fill:
              target: '#rsbu-fix-adjust'
              value: 31.03.2025
          - click: '[data-rsbu-fix-submit]'
          - waitFor: '#rsbu-fix-alert:not([hidden])'
      - state: 69
        id: pay-fixed
        title: Фиксация сохранена
        page: Tranche.preview.html?id=1028&tr=1028.d1.p1.i1.t1&rasFix=fixed&rasAdj=none
        note: '«Дата фиксации РСБУ: 31.03.2025»; повторное «Зафиксировать РСБУ» откроет окно с прежними датами.'
      - state: 70
        id: pay-view
        title: Без права фиксации
        page: Tranche.preview.html?id=1028&tr=1028.d1.p1.i1.t1&hardsMode=view&rasFix=none&rasAdj=none
        note: Кнопки «Зафиксировать РСБУ» нет; «Пересчитать платежи» остаётся.

  - id: rsbu-tile
    title: Показ тайла корректировок — готовые виды
    desc: Готовые виды тайла «Корректировки процентов РСБУ» по условиям, данным и правам — адресом, для показа и снимков
    steps:
      - state: 5
        id: rsbu-tile-locked
        title: Требуется расчёт
        page: Tranche.preview.html?id=1028&tr=1028.d1.p1.i1.t1&hardsState=locked&rasFix=none&rasAdj=none
        note: Условия не выполнены — процентные платежи не рассчитаны. «Требуется расчёт процентных платежей», стрелки и кнопки нет.
      - state: 6
        id: rsbu-tile-none
        title: Корректировок нет
        page: Tranche.preview.html?id=1028&tr=1028.d1.p1.i1.t1&hardsState=none&rasFix=none&rasAdj=none
        note: «Корректировки отсутствуют»; кнопка «Внести корректировку» ведёт на страницу корректировок с поднятым окном.
      - state: 7
        id: rsbu-tile-filled
        title: Корректировки внесены
        page: Tranche.preview.html?id=1028&tr=1028.d1.p1.i1.t1&rasAdj=created
        note: '«Внесено корректировок: 2»; стрелка и кнопка остаются.'
      - state: 8
        id: rsbu-tile-view
        title: Без права редактирования
        page: Tranche.preview.html?id=1028&tr=1028.d1.p1.i1.t1&hardsMode=view&rasAdj=created
        note: Кнопки «Внести корректировку» нет, стрелка на страницу корректировок остаётся — смотреть можно.

  - id: rsbu-page
    title: Показ страницы корректировок
    desc: Готовые состояния таблицы корректировок, окна и подтверждения — адресом, для показа и снимков
    steps:
      - state: 9
        id: rsbu-page-empty
        title: Корректировок нет
        page: RsbuInterestAdjustments.preview.html?id=1028&tr=1028.d1.p1.i1.t1&rasAdj=none
        note: Пустая таблица — только колонки; «В транш» и «Внести корректировку» в шапке страницы.
      - state: 10
        id: rsbu-page-modal
        title: Окно ручной корректировки
        page: RsbuInterestAdjustments.preview.html?id=1028&tr=1028.d1.p1.i1.t1&open=add&rasAdj=none
        note: Так страница открывается с кнопки на тайле. Даты — поля с календарём; шесть сумм — слева начисленные, справа «Кап.»; «Сумма корректировки» — только чтение.
        do:
          - waitFor: '#rsbu-adj-scrim:not([hidden])'
      - state: 11
        id: rsbu-page-filled
        title: Корректировки из дельт
        page: RsbuInterestAdjustments.preview.html?id=1028&tr=1028.d1.p1.i1.t1&rasAdj=created
        note: Строки, созданные «Пересчитать платежи»; правки нет — только удаление корзиной.
      - state: 13
        id: rsbu-page-delete
        title: Подтверждение удаления
        page: RsbuInterestAdjustments.preview.html?id=1028&tr=1028.d1.p1.i1.t1&rasAdj=created&demo=delete
        note: Окно предупреждает, что после пересчёта метрик значение на исходной дате изменится.
        do:
          - waitFor: '#rh-delete-scrim:not([hidden])'
