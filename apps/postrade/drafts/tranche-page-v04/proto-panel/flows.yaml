# Сценарии показа прототипа Post — Корректировки РСБУ v4 — панель прототипа.
# Формат — .agents/proto-panel/README.md, раздел «flows.yaml».
# После правки: node .agents/tools/proto-panel.mjs (пересобрать зеркало).
# Основа — сценарии концепта v3 (RE0034, RE0035 Э4); v4 — фиксация на транше, 28.10.2026;
# RE0050 (03.11.2026) — фиксация и пересчёт слиты в одну операцию «Пересчитать с фиксацией»
# (период вместо даты), отчёт РСБУ — помесячная сетка колонок 01.2025–12.2027, корректировки
# повторных пересчётов накапливаются.
# Номера состояний постоянны (урок Л255): шаги, что остались от v3, держат свои номера;
# номера убранных шагов (12, 14–53 кроме оставшихся) повторно не выдаются, новые — с 54.
# 05.11.2026: два продуктовых сценария — автоматическая корректировка через тайл «Процентные
# платежи» (main) и корректировки вручную без него (manual); «Автопоказ» остаётся сквозным показом.
version: 1
lastState: 82
flows:
  - id: main
    title: Автоматическая корректировка через тайл «Процентные платежи»
    desc: 'Сделка → транш (пересчёт с фиксацией: период и целевая дата корректировки, корректировки создаются сразу) → корректировки → метрики (пересчёт) → отчёт РСБУ. Готовых состояний в адресе нет, старт — с чистого.'
    steps:
      - state: 1
        id: start
        title: Страница сделки — чистый старт
        page: Deal.preview.html?id=1028&rasReset=1
        note: 'Старт: человек сам открывает страницу сделки по этому адресу — он сбрасывает сохранённые корректировки и пересчёт платежей этой сделки и убирает параметр, поэтому обновление страницы ход прохождения не стирает. Дальше человек сам открывает транш по названию в дереве продуктов.'
      - state: 3
        id: main-tranche
        title: Транш — тайл «Процентные платежи»
        page: Tranche.preview.html?id=1028&tr=1028.d1.p1.i1.t1
        note: На тайле «Процентные платежи» — «Пересчитать» и «Пересчитать с фиксацией»; тайл «Корректировки процентов РСБУ» — «Корректировки отсутствуют». Человек сам вносит изменения транша (за кадром) и жмёт «Пересчитать с фиксацией».
      - state: 54
        id: main-fix-modal
        title: Окно «Пересчет с фиксацией»
        page: Tranche.preview.html?id=1028&tr=1028.d1.p1.i1.t1
        note: 'Период фиксации — От 01.01.2025 До 31.03.2025 (закрыт первый квартал): значения за период пересчёт не меняет. Целевая дата корректировки сама становится 01.04.2025. Человек сам жмёт «Пересчитать» — пересчёт запускается сразу, корректировки создаются сами.'
      - state: 55
        id: main-recalculated
        title: Пересчёт с фиксацией выполнен — корректировки созданы
        page: Tranche.preview.html?id=1028&tr=1028.d1.p1.i1.t1
        note: 'Снек «Платежи пересчитаны. Создано корректировок РСБУ: 3», тайл корректировок — «Внесено корректировок: 3». Дальше человек сам открывает тайл корректировок стрелкой.'
      - state: 4
        id: main-adjustments
        title: Корректировки — строки из дельт
        page: RsbuInterestAdjustments.preview.html?id=1028&tr=1028.d1.p1.i1.t1
        note: 'Три строки: исходные даты 16.01.2025, 13.02.2025 и 31.03.2025, целевая дата корректировки — 01.04.2025; сумма корректировки — сумма шести видов процентов. Человек сам может удалить строку.'
      - state: 2
        id: main-metrics
        title: Финансовые метрики · РСБУ до пересчёта
        page: FinancialMetrics.preview.html?id=1028
        note: 'Вкладка РСБУ: отчёт ещё прежний — корректировки входят в отчёт при пересчёте метрик. Человек сам жмёт «Пересчет метрик» (вкладку выбирать не обязательно).'
        do:
          - click: '#tab-ras'
          - waitFor: '#panel-ras:not([hidden])'
      - state: 57
        id: main-report-mark
        title: Отчёт РСБУ после пересчёта
        page: FinancialMetrics.preview.html?id=1028
        note: После пересчёта у ФИ «128-Кредит-202» в строке «Начисленные проценты за период» колонка 01.04.2025 — жёлтая ячейка с меткой, тултип «Внесена корректировка процентов РСБУ на сумму +… RUB». Колонки зафиксированного периода — как до пересчёта, остальные — новый расчёт. Повторный пересчёт метрик колонки периода не меняет.
        do:
          - click: '#tab-ras'
          - waitFor: '#panel-ras:not([hidden])'

  - id: manual
    title: Корректировки вручную, без тайла «Процентные платежи»
    desc: Транш → тайл «Корректировки процентов РСБУ» → страница корректировок → «Внести корректировку» → метрики → отчёт РСБУ. Тайл «Процентные платежи» не используется.
    steps:
      - state: 76
        id: manual-start
        title: Страница сделки — чистый старт
        page: Deal.preview.html?id=1028&rasReset=1
        note: 'Старт: страница сделки сбрасывает сохранённые корректировки и пересчёт платежей этой сделки. Дальше человек сам открывает транш по названию в дереве продуктов.'
      - state: 77
        id: manual-tranche
        title: Транш — тайл «Корректировки процентов РСБУ»
        page: Tranche.preview.html?id=1028&tr=1028.d1.p1.i1.t1&rasAdj=none
        note: «Корректировки отсутствуют»; стрелка тайла ведёт на страницу корректировок. Тайл «Процентные платежи» в этом сценарии не используется.
      - state: 78
        id: manual-page-empty
        title: Страница корректировок — корректировок нет
        page: RsbuInterestAdjustments.preview.html?id=1028&tr=1028.d1.p1.i1.t1&rasAdj=none
        note: 'Пустое состояние таблицы: «Корректировок пока нет» и кнопка «Внести корректировку».'
        do:
          - waitFor: '#rh-empty:not([hidden])'
      - state: 79
        id: manual-modal
        title: Окно «Корректировка процентов»
        page: RsbuInterestAdjustments.preview.html?id=1028&tr=1028.d1.p1.i1.t1&open=add&rasAdj=none
        note: Исходная дата — дата отчёта РСБУ; целевая дата корректировки — позже исходной; шесть сумм, «Сумма корректировки» считается при вводе.
        do:
          - waitFor: '#rsbu-adj-scrim:not([hidden])'
          - fill:
              target: '#rsbu-adj-start'
              value: 16.01.2025
          - fill:
              target: '#rsbu-adj-end'
              value: 01.04.2025
          - fill:
              target: '#rsbu-adj-p1'
              value: '10000'
          - fill:
              target: '#rsbu-adj-p2'
              value: '2500'
      - state: 80
        id: manual-saved
        title: Ручная корректировка внесена
        page: RsbuInterestAdjustments.preview.html?id=1028&tr=1028.d1.p1.i1.t1&rasAdj=manual
        note: Строка ручной корректировки 16.01.2025 → 01.04.2025 на 12 500,00; тост «Корректировка добавлена».
      - state: 81
        id: manual-metrics
        title: Финансовые метрики · РСБУ до пересчёта
        page: FinancialMetrics.preview.html?id=1028&rasAdj=manual
        note: 'Вкладка РСБУ: отчёт ещё прежний — ручная корректировка входит в отчёт при пересчёте метрик.'
        do:
          - click: '#tab-ras'
          - waitFor: '#panel-ras:not([hidden])'
      - state: 82
        id: manual-report
        title: Отчёт РСБУ после пересчёта
        page: FinancialMetrics.preview.html?id=1028&rasAdj=manual-applied
        note: Жёлтая ячейка на 01.04.2025 — целевая дата корректировки; тултип «Внесена корректировка процентов РСБУ на сумму +12 500,00 RUB».
        do:
          - click: '#tab-ras'
          - waitFor: '#panel-ras:not([hidden]) [data-fm-adjusted]'

  - id: ras-e2e
    title: 'Автопоказ: весь сценарий'
    desc: 'Готовый путь для показа и снимков: панель сама нажимает кнопки от страницы сделки до отметки в отчёте РСБУ (сделка 1028, «Ввод изменений»); начинается с чистого состояния'
    steps:
      - state: 58
        id: e2e4-deal
        title: Страница сделки
        page: Deal.preview.html?id=1028&rasReset=1
        note: Март закрыт, данные ушли в 1С; данные за март пришли позже. Дальше — транш.
      - state: 59
        id: e2e-fix-modal
        title: Окно «Пересчет с фиксацией»
        page: Tranche.preview.html?id=1028&tr=1028.d1.p1.i1.t1&rasAdj=none
        note: «Пересчитать с фиксацией» на тайле «Процентные платежи». Период фиксации От 01.01.2025 До 31.03.2025 — значения начисленных процентов за период не меняются пересчётом; целевая дата корректировки — 01.04.2025, на неё переносятся суммы дельт.
        do:
          - click: '#ip-fix-recalc'
          - waitFor: '#rsbu-fix-scrim:not([hidden])'
          - fill:
              target: '#rsbu-fix-from'
              value: 01.01.2025
          - fill:
              target: '#rsbu-fix-to'
              value: 31.03.2025
          - fill:
              target: '#rsbu-fix-adjust'
              value: 01.04.2025
      - state: 60
        id: e2e-recalc-run
        title: Пересчёт запущен
        note: '«Пересчитать» в окне: окно закрылось, лоадер на «Пересчитать с фиксацией», обе кнопки тайла выключены (~1,5 с).'
        do:
          - click: '[data-rsbu-fix-submit]'
          - waitFor:
              target: '#ip-fix-recalc.btn--loading'
              timeout: 8000
          - waitFor: '#ip-recalc[disabled]'
      - state: 61
        id: e2e4-recalc
        title: Пересчёт выполнен — корректировки созданы
        note: 'Дельты дат Q1 2025 стали корректировками на 01.04.2025; тайл корректировок — «Внесено корректировок: 3», снек «Платежи пересчитаны. Создано корректировок РСБУ: 3».'
        do:
          - waitFor:
              target: '#tile-rsbu-adjustments[data-state="data"]'
              timeout: 8000
      - state: 62
        id: e2e-adjustments
        title: Страница корректировок
        page: RsbuInterestAdjustments.preview.html?id=1028&tr=1028.d1.p1.i1.t1&rasAdj=created
        note: Строка на каждую дату периода с дельтой (три); шесть видов процентов и их сумма.
      - state: 63
        id: e2e-manual-modal
        title: Окно ручной корректировки
        note: '«Внести корректировку»: шесть сумм в три ряда по две колонки, «Сумма корректировки» считается при вводе.'
        do:
          - click: '#rh-add'
          - waitFor: '#rsbu-adj-scrim:not([hidden])'
          - fill:
              target: '#rsbu-adj-start'
              value: 16.01.2025
          - fill:
              target: '#rsbu-adj-end'
              value: 01.04.2025
          - fill:
              target: '#rsbu-adj-p1'
              value: '10000'
          - fill:
              target: '#rsbu-adj-p2'
              value: '2500'
      - state: 64
        id: e2e-manual-saved
        title: Ручная корректировка внесена
        note: «Добавить» — строка в таблице, тост «Корректировка добавлена».
        do:
          - click: '[data-rsbu-submit]'
          - waitFor:
              target: '#rsbu-adj-scrim'
              state: hidden
      - state: 65
        id: e2e4-report
        title: Пересчёт метрик — отметка в отчёте РСБУ
        page: FinancialMetrics.preview.html?id=1028&rasAdj=created
        note: '«Пересчет метрик»: в строке «Начисленные проценты за период» колонка 01.04.2025 — жёлтая ячейка, тултип «Внесена корректировка процентов РСБУ на сумму +… RUB»; колонки зафиксированного периода — как до пересчёта.'
        do:
          - click: '#tab-ras'
          - waitFor: '#panel-ras:not([hidden]) [data-node]'
          - click: '#fm-calc'
          - waitFor:
              target: '#panel-ras [data-fm-adjusted]'
              timeout: 8000

  - id: rsbu-payments
    title: Показ тайла «Процентные платежи»
    desc: Готовые виды тайла и окна «Пересчет с фиксацией» — адресом, для показа и снимков
    steps:
      - state: 66
        id: pay-none
        title: Корректировок нет
        page: Tranche.preview.html?id=1028&tr=1028.d1.p1.i1.t1&rasAdj=none
        note: «Заполнено», кнопки «Пересчитать» и «Пересчитать с фиксацией».
      - state: 67
        id: pay-modal
        title: Окно «Пересчет с фиксацией»
        page: Tranche.preview.html?id=1028&tr=1028.d1.p1.i1.t1&rasAdj=none&open=fix
        note: Период фиксации (От/До, календарь) и целевая дата корректировки; по умолчанию она — первое число месяца после «До». Окно всегда открывается пустым.
        do:
          - waitFor: '#rsbu-fix-scrim:not([hidden])'
      - state: 68
        id: pay-modal-error
        title: Ошибка — целевая дата корректировки не позже конца периода
        page: Tranche.preview.html?id=1028&tr=1028.d1.p1.i1.t1&rasAdj=none&open=fix
        note: Целевая дата корректировки должна быть позже конца периода фиксации — Alert вверху окна, поле красное.
        do:
          - waitFor: '#rsbu-fix-scrim:not([hidden])'
          - fill:
              target: '#rsbu-fix-from'
              value: 01.01.2025
          - fill:
              target: '#rsbu-fix-to'
              value: 31.03.2025
          - fill:
              target: '#rsbu-fix-adjust'
              value: 31.03.2025
          - click: '[data-rsbu-fix-submit]'
          - waitFor: '#rsbu-fix-alert:not([hidden])'
      - state: 69
        id: pay-done
        title: Пересчёт с фиксацией выполнен
        page: Tranche.preview.html?id=1028&tr=1028.d1.p1.i1.t1&rasAdj=created
        note: 'Тайл корректировок — «Внесено корректировок: 3» (дельты Q1 2025 перенесены на 01.04.2025); штампа фиксации на тайле платёжей нет. Повторное «Пересчитать с фиксацией» откроет пустое окно — новый период и новая целевая дата корректировки.'
      - state: 70
        id: pay-view
        title: Без права пересчёта
        page: Tranche.preview.html?id=1028&tr=1028.d1.p1.i1.t1&hardsMode=view&rasAdj=none
        note: Без права на пересчёт нет ни одной из двух кнопок — «Пересчитать» и «Пересчитать с фиксацией» обе скрыты.
        do:
          - waitFor:
              target: '#ip-recalc'
              state: hidden
          - waitFor:
              target: '#ip-fix-recalc'
              state: hidden
      - state: 73
        id: pay-recalc
        title: Обычный пересчёт — без корректировок
        page: Tranche.preview.html?id=1028&tr=1028.d1.p1.i1.t1&rasAdj=none
        note: '«Пересчитать» без окна: лоадер на ней, «Пересчитать с фиксацией» тоже выключена на время операции; корректировки не создаются, снек «Процентные платежи транша пересчитаны».'
        do:
          - click: '#ip-recalc'
          - waitFor: '#ip-recalc.btn--loading'
          - waitFor: '#ip-fix-recalc[disabled]'
      - state: 75
        id: pay-no-fi
        title: Транш без ФИ — «Пересчитать с фиксацией» заблокирована
        page: Tranche.preview.html?id=1026&tr=1026.d1.p1.i1.t1&rasAdj=none
        note: Без ФИ «Пересчитать» доступна, «Пересчитать с фиксацией» видна и выключена; при наведении — тултип с причиной (решение человека 05.11.2026).
        do:
          - waitFor: '#ip-fix-recalc[disabled]'
          - waitFor: '#ip-recalc'
          - hover: '#ip-fix-anchor'
          - waitFor: '.tip.is-visible'

  - id: rsbu-tile
    title: Показ тайла корректировок — готовые виды
    desc: Готовые виды тайла «Корректировки процентов РСБУ» по условиям, данным и правам — адресом, для показа и снимков
    steps:
      - state: 5
        id: rsbu-tile-locked
        title: Требуется расчёт
        page: Tranche.preview.html?id=1028&tr=1028.d1.p1.i1.t1&hardsState=locked&rasAdj=none
        note: Условия не выполнены — процентные платежи не рассчитаны. «Требуется расчёт процентных платежей», стрелки и кнопки нет.
      - state: 6
        id: rsbu-tile-none
        title: Корректировок нет
        page: Tranche.preview.html?id=1028&tr=1028.d1.p1.i1.t1&hardsState=none&rasAdj=none
        note: «Корректировки отсутствуют»; кнопка «Внести корректировку» ведёт на страницу корректировок с поднятым окном.
      - state: 7
        id: rsbu-tile-filled
        title: Корректировки внесены
        page: Tranche.preview.html?id=1028&tr=1028.d1.p1.i1.t1&rasAdj=created
        note: '«Внесено корректировок: 3»; стрелка и кнопка остаются.'
      - state: 8
        id: rsbu-tile-view
        title: Без права редактирования
        page: Tranche.preview.html?id=1028&tr=1028.d1.p1.i1.t1&hardsMode=view&rasAdj=created
        note: Кнопки «Внести корректировку» нет, стрелка на страницу корректировок остаётся — смотреть можно.

  - id: rsbu-page
    title: Показ страницы корректировок
    desc: Готовые состояния таблицы корректировок, окна и подтверждения — адресом, для показа и снимков
    steps:
      - state: 9
        id: rsbu-page-empty
        title: Корректировок нет
        page: RsbuInterestAdjustments.preview.html?id=1028&tr=1028.d1.p1.i1.t1&rasAdj=none
        note: Пустое состояние таблицы ДС — «Корректировок пока нет» и кнопка «Внести корректировку» под шапкой колонок; пагинация видна и без строк. «В транш» в шапке страницы.
        do:
          - waitFor: '#rh-empty:not([hidden])'
          - waitFor: '#rh-empty-add:not([hidden])'
          - waitFor: '#rh-footer:not([hidden])'
      - state: 74
        id: rsbu-page-view
        title: Страница корректировок — без права редактирования
        page: RsbuInterestAdjustments.preview.html?id=1028&tr=1028.d1.p1.i1.t1&hardsMode=view&rasAdj=created
        note: Кнопки «Внести корректировку» нет, в строке нет корзины — колонки «Действия» тоже нет; таблица только для просмотра.
        do:
          - waitFor:
              target: '#rh-add'
              state: hidden
          - waitFor: '#rh-tbl:not([hidden])'
      - state: 10
        id: rsbu-page-modal
        title: Окно ручной корректировки
        page: RsbuInterestAdjustments.preview.html?id=1028&tr=1028.d1.p1.i1.t1&open=add&rasAdj=none
        note: Так страница открывается с кнопки на тайле. Даты — поля с календарём; шесть сумм — слева начисленные, справа «Кап.»; «Сумма корректировки» — только чтение.
        do:
          - waitFor: '#rsbu-adj-scrim:not([hidden])'
      - state: 11
        id: rsbu-page-filled
        title: Корректировки из дельт
        page: RsbuInterestAdjustments.preview.html?id=1028&tr=1028.d1.p1.i1.t1&rasAdj=created
