<!-- Связанный артефакт тайла «Корректировки процентов РСБУ»: окно ручной корректировки
     (RE0034, концепт v4). Только добавление — правки строк нет.

     Фрагмент вшивается ассемблером отдельной меткой ds-include — скрим должен лежать
     в конце body, а не внутри тайла.

     Значения в разметке — пустая форма. Даты — обычные поля даты с календарём. Шесть сумм —
     три ряда по две колонки: слева начисленные проценты, справа «Кап.» того же вида;
     «Сумма корректировки» — только чтение на подложке Tile Inset, её считает
     RsbuAdjustmentModal.js при вводе. Комментарий необязателен. Ошибка проверки — Alert
     вверху окна и красные поля. -->

<div class="modal-scrim" id="rsbu-adj-scrim" hidden>
  <div class="modal modal--w5" role="dialog" aria-modal="true" aria-labelledby="rsbu-adj-title">
    <header class="modal__head">
      <h2 class="modal__title" id="rsbu-adj-title">Корректировка процентов</h2>
      <button type="button" class="ibtn ibtn--neutral ibtn--l" aria-label="Закрыть" data-modal-close><i data-icon="close"></i></button>
    </header>

    <div class="modal__alert" id="rsbu-adj-alert" hidden>
      <div class="alert alert--error alert--m alert--flush" data-alert-tone="error" role="alert">
        <span class="alert__icon" aria-hidden="true"><i data-icon="alert-circle-filled"></i></span>
        <div class="alert__body"><p class="alert__text" id="rsbu-adj-alert-text"></p></div>
      </div>
    </div>

    <div class="modal__body">
      <form class="lc-rsbu-form" id="rsbu-adj-form" onsubmit="return false" novalidate>
        <div class="lc-rsbu-form__row">
          <div class="inp inp--m">
            <label class="ds-label ds-label--wrap" for="rsbu-adj-start"><span class="ds-label__text">Исходная дата</span></label>
            <div class="inp__field"><input class="inp__control" id="rsbu-adj-start" name="startDate" placeholder="ДД.ММ.ГГГГ" inputmode="numeric"><span class="inp__acts"><button type="button" class="inp__act" aria-label="Открыть календарь" aria-haspopup="dialog"><i data-icon="calendar"></i></button></span></div>
          </div>
          <div class="inp inp--m">
            <label class="ds-label ds-label--wrap" for="rsbu-adj-end"><span class="ds-label__text">Целевая дата</span></label>
            <div class="inp__field"><input class="inp__control" id="rsbu-adj-end" name="endDate" placeholder="ДД.ММ.ГГГГ" inputmode="numeric"><span class="inp__acts"><button type="button" class="inp__act" aria-label="Открыть календарь" aria-haspopup="dialog"><i data-icon="calendar"></i></button></span></div>
          </div>
        </div>
        <div class="lc-rsbu-form__row">
          <div class="inp inp--m">
            <label class="ds-label ds-label--wrap" for="rsbu-adj-p1"><span class="ds-label__text">Текущие начисленные проценты</span></label>
            <div class="inp__field"><input class="inp__control" id="rsbu-adj-p1" name="currentInterest" inputmode="decimal" data-amount><span class="inp__postfix" data-rsbu-currency>RUB</span></div>
          </div>
          <div class="inp inp--m">
            <label class="ds-label ds-label--wrap" for="rsbu-adj-p2"><span class="ds-label__text">Кап. текущие начисленные проценты</span></label>
            <div class="inp__field"><input class="inp__control" id="rsbu-adj-p2" name="currentInterestCap" inputmode="decimal" data-amount><span class="inp__postfix" data-rsbu-currency>RUB</span></div>
          </div>
        </div>
        <div class="lc-rsbu-form__row">
          <div class="inp inp--m">
            <label class="ds-label ds-label--wrap" for="rsbu-adj-p3"><span class="ds-label__text">Капитализированные начисленные проценты</span></label>
            <div class="inp__field"><input class="inp__control" id="rsbu-adj-p3" name="capitalizedInterest" inputmode="decimal" data-amount><span class="inp__postfix" data-rsbu-currency>RUB</span></div>
          </div>
          <div class="inp inp--m">
            <label class="ds-label ds-label--wrap" for="rsbu-adj-p4"><span class="ds-label__text">Кап. капитализированные начисленные проценты</span></label>
            <div class="inp__field"><input class="inp__control" id="rsbu-adj-p4" name="capitalizedInterestCap" inputmode="decimal" data-amount><span class="inp__postfix" data-rsbu-currency>RUB</span></div>
          </div>
        </div>
        <div class="lc-rsbu-form__row">
          <div class="inp inp--m">
            <label class="ds-label ds-label--wrap" for="rsbu-adj-p5"><span class="ds-label__text">Отложенные начисленные проценты</span></label>
            <div class="inp__field"><input class="inp__control" id="rsbu-adj-p5" name="deferredInterest" inputmode="decimal" data-amount><span class="inp__postfix" data-rsbu-currency>RUB</span></div>
          </div>
          <div class="inp inp--m">
            <label class="ds-label ds-label--wrap" for="rsbu-adj-p6"><span class="ds-label__text">Кап. отложенные начисленные проценты</span></label>
            <div class="inp__field"><input class="inp__control" id="rsbu-adj-p6" name="deferredInterestCap" inputmode="decimal" data-amount><span class="inp__postfix" data-rsbu-currency>RUB</span></div>
          </div>
        </div>
        <!-- Сумма корректировки — только чтение, на подложке Tile Inset (сумма шести полей) -->
        <div class="tile tile--inset tile--headless">
          <div class="tile__body">
            <div class="rof">
              <span class="ds-label"><span class="ds-label__text">Сумма корректировки</span></span>
              <div class="rof__row"><span class="rof__value" data-rsbu-total>0,00</span><span class="rof__affix" data-rsbu-currency>RUB</span></div>
            </div>
          </div>
        </div>
        <div class="inp inp--m inp--multiline">
          <label class="ds-label ds-label--wrap" for="rsbu-adj-cmt"><span class="ds-label__text">Комментарий</span></label>
          <div class="inp__field"><textarea class="inp__control" id="rsbu-adj-cmt" name="comment" rows="3"></textarea></div>
        </div>
      </form>
    </div>

    <footer class="modal__foot">
      <div class="modal__foot-right">
        <button type="button" class="btn btn--transparent btn--m" data-modal-close><span class="btn__label">Отменить</span></button>
        <button type="button" class="btn btn--accent btn--m" data-rsbu-submit><span class="btn__label">Добавить</span></button>
      </div>
    </footer>
  </div>
</div>
