<!-- Локальный компонент «Отчет KPI» (KPITable) — вкладка KPI страницы «Финансовые метрики».
     Пара во фронтенде — KPITable. Карточка (Tile) с заголовком и сегмент-контролом
     «Краткий» / «Подробный» (SegmentControl XS) в действиях шапки (внутри вкладки KPI
     страницы МСФО · РСБУ · KPI · Фиксации ЭПС/ВБС стоит эта карточка), тулбар с «Фильтр»
     и таблица. Вшивается общим сборщиком (.agents/tools/assemble.mjs)
     по метке ds-include на экране.
     Каркас показан в состоянии «Загрузка», пока страница не передала отчеты: «Фильтр»
     заблокирован, в таблице скелетоны. Таблицу, тулбар и остальные состояния рисует
     KPITable.js поверх FinancialMetricsTable.js:
     PostKpiTable.render(корень, { KPI_SHORT, KPI_FULL }, фильтр). -->
<section class="tile lc-kpi-table" data-state="loading" data-view="KPI_SHORT">
  <header class="tile__header">
    <div class="tile__header-main">
      <div class="tile__title-row"><h3 class="tile__title">Отчет KPI</h3></div>
    </div>
    <div class="tile__actions">
      <div class="segctrl segctrl--xs" role="radiogroup" data-segctrl aria-label="Вид отчета KPI">
        <div class="segctrl__thumb"></div>
        <button type="button" class="segctrl__item" role="radio" aria-checked="true" tabindex="0" data-view="KPI_SHORT"><span class="segctrl__label">Краткий</span></button>
        <button type="button" class="segctrl__item" role="radio" aria-checked="false" tabindex="-1" data-view="KPI_FULL"><span class="segctrl__label">Подробный</span></button>
      </div>
    </div>
  </header>
  <div class="tile__body lc-kpi-table__body">
    <div class="dtable-toolbar">
      <div class="tfilter tfilter--disabled" role="group" aria-label="Фильтр таблицы">
        <button type="button" class="btn btn--outline btn--s tfilter__open" aria-haspopup="dialog" aria-expanded="false" disabled><i data-icon="filter"></i><span class="btn__label">Фильтр</span></button>
      </div>
    </div>
    <div class="lc-kpi-table__table" data-fm-table>
      <div class="dtable dtable--fill" aria-busy="true">
        <div class="dtable__body">
          <div class="tbl" data-table>
            <div class="tbl__row tbl__row--head" style="grid-template-columns:8px 400px repeat(2, 160px) minmax(8px,1fr)">
              <div class="th th--separator"></div>
              <div class="th"><span class="th__label" data-grab>Наименование метрики</span><span class="th__resize" role="separator" aria-orientation="vertical" tabindex="0" aria-label="Изменить ширину колонки"></span></div>
              <div class="th th--right"><span class="sk-line sk-line--caption" style="--sk-w:60%"></span><span class="th__resize" role="separator" aria-orientation="vertical" tabindex="0" aria-label="Изменить ширину колонки"></span></div>
              <div class="th th--right"><span class="sk-line sk-line--caption" style="--sk-w:60%"></span><span class="th__resize" role="separator" aria-orientation="vertical" tabindex="0" aria-label="Изменить ширину колонки"></span></div>
              <div class="th th--separator"></div>
            </div>
            <div class="tbl__row" style="grid-template-columns:8px 400px repeat(2, 160px) minmax(8px,1fr)">
              <div class="tc tc--separator"></div>
              <div class="tc tc--skeleton" aria-busy="true"><span class="sk-line sk-line--caption" style="--sk-w:60%"></span></div>
              <div class="tc tc--numbers tc--skeleton" aria-busy="true"><span class="sk-line sk-line--caption" style="--sk-w:60%"></span></div>
              <div class="tc tc--numbers tc--skeleton" aria-busy="true"><span class="sk-line sk-line--caption" style="--sk-w:60%"></span></div>
              <div class="tc tc--separator"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
