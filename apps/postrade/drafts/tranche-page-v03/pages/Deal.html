<!DOCTYPE html>
<!--
  ИСТОЧНИК страницы сделки концепта v3 (RE0034). Двойным кликом открывают НЕ этот файл, а собранный
  Deal.preview.html: тайлы здесь стоят метками <ds-include>, а рантайм-инклуд ДС тянет фрагменты
  через fetch, который по file:// не работает.

    node .agents/tools/assemble.mjs        — пересобрать после правки любого виджета

  Вид страницы — как у страницы сделки модуля postrade/deals-app (22.10.2026), но без окон правки,
  поповера и переходов, которых в концепте нет: тайлы стоят на просмотр, кнопки-триггеры отсутствующих
  окон скрыты (hideDeadActions). Живые переходы сценария RE0034: название транша в дереве продуктов →
  Tranche, «Отчеты →» на тайле метрик → FinancialMetrics. Окно «Фиксация ЭПС/ВБС» тайла метрик
  оставлено — иначе кнопка тайла мертва.
  Адрес: Deal.html?id=<номер сделки>; без ?id= открывается сделка 1028 («Ввод изменений»).
-->
<html lang="ru">
<head>
<script src="../../../../ds-config.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Сделка — IBP</title>
<!-- @lc-css --><!-- сюда ассемблер вставляет CSS подключённых локальных компонентов -->
<style>
  /* ---------- только раскладка экрана, на токенах ДС ---------- */
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  body {
    margin: 0;
    font-family: var(--font-text), system-ui, sans-serif;
    color: var(--text-primary);
    background: var(--bg-page);
  }

  /* ---------- Секция «Общая информация» ----------
     Сворачиваемого заголовка раздела в ДС нет: Tile-аккордеон живёт только
     внутри .tile (ds-tile.js ищет closest('.tile')), а здесь заголовок стоит
     на фоне страницы. Секция собрана из атомов ДС — IconButton + токен
     типографики; переключение делает экранный скрипт. Находка «нет компонента
     SectionAccordion» записана в Deal.screen.md, §6. */
  .gen { display: flex; flex-direction: column; gap: var(--space-12); }
  .gen__head { display: flex; align-items: center; gap: var(--space-8); }
  .gen__title { margin: 0; font: var(--type-h5-strong); color: var(--text-primary); }
  .gen__chevron { transition: transform .15s ease; }
  .gen__toggle[aria-expanded="false"] .gen__chevron { transform: rotate(180deg); }
  @media (prefers-reduced-motion: reduce) { .gen__chevron { transition: none; } }

  /* Две колонки блока: слева сетка тайлов, справа тайл фиксированной ширины.
     Парное [hidden] — соглашение ДС: правило display у класса (0,1,0) иначе
     перебивает UA-правило [hidden] (0,0,0) и сворачивание молча ломается. */
  .gen__body { display: flex; align-items: stretch; gap: var(--space-16); }
  .gen__body[hidden] { display: none; }
  .gen__main { flex: 1; min-width: 0; }
  /* display:grid — единственный ребёнок (тайл) тянется на всю высоту колонки
     сам, без правил экрана на .tile.
     contain: size — колонка не отдаёт ряду высоту своего содержимого: высоту
     блока задаёт левая секция (не меньше 400px из ТЗ), длинный степпер
     прокручивается внутри тайла (RE0026, решение человека 16.10.2026). */
  .gen__side { flex: 0 0 320px; min-height: 400px; display: grid; contain: size; }

  /* ---------- Перестроение ----------
     Настоящий механизм («адаптивно, а не по брейкпоинтам») ещё не описан — см.
     Deal.screen.md, §6. До него — штатная пара .col-N/.colw-N из Spacing и
     пороги по ширине РАБОЧЕЙ ОБЛАСТИ (контейнер screen из Layout): закрепление
     боковой панели сужает контент, не меняя окна. Сами пороги — выбор этого
     экрана, а не правило ДС: общих брейкпоинтов в ДС нет, порог задаёт экран. */
  /* ---------- Минимальная высота тайла ----------
     200px — решение человека 21.09.2026 (закрыт вопрос «H min со схемы
     раскладки» в паспортах тайлов). Задаёт страница: это параметр раскладки,
     а не компонента. Минимум — вид по умолчанию для всех тайлов, в том числе
     заглушек (решение человека 22.09.2026): ряд выше только тогда, когда
     содержимое наполненного тайла больше, и соседи по ряду тянутся за ним
     сами (Tile). Поэтому тайл без состава полей — строка по центру, а не
     EmptyState: его иллюстрация и отступы давали ≈324px и тянули весь ряд.
     Карточки окна КНР (Card — тоже .tile) стоят вне .screen__content и правило
     не получают. */
  .screen__content .tile { min-height: 200px; }
  /* Исключение — ряд «Сведения о проекте»: он один в своём ряду, соседей,
     за которыми тянуться, нет, и тайл по макету компактный — высота по
     содержимому (решение человека 28.09.2026). */
  #row-project-info .tile { min-height: 0; }

  @container screen (max-width: 1560px) {
    .gen__body { flex-direction: column; }
    /* под левой секцией тянуться не за кем — высота по содержимому (RE0026) */
    .gen__side { flex: 0 0 auto; contain: none; }
  }
  @container screen (max-width: 1240px) {
    .tile-row > [class*="colw-"] { grid-column: span var(--colw); }
  }
</style>
</head>

<script>
/* Экранный скрипт. Делает только то, чего рантаймы ДС не делают:
   меню по каталогу ролей, данные сделки (шапка и тайлы), переключение
   панелей табов и сворачивание секции (компонента «заголовок-аккордеон» в ДС
   нет).
   Скрипт синхронный и стоит после ds.js — поэтому его DSTabs.tabs(...) успевает
   раньше автопривязки wireAll (она на DOMContentLoaded), и onChange не теряется. */
(function () {
  'use strict';
  var role = window.IBPHome.defaultRole;
  var SELECTED_ID = 'current-portfolio';
  /* строка пользователя в футере меню ведёт на хаб проектов (корневой index.html).
     Футер отдаёт IBPHome.footerHTML с зашитым href="#" — подменяем ссылку
     здесь, каталог ДС не трогаем. Проверяет сторож registry-check.mjs. */
  var USER_LINK_FROM = ' href="#" aria-label="Открыть личный кабинет"';
  var USER_LINK_TO = ' href="../../../../../index.html" aria-label="Хаб проектов"';

  function ic(name) { return '<i data-icon=\'' + name + '\'></i>'; }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function itemHTML(it) {
    /* пункт с тайлом-со-ссылками — аккордеон-родитель (под-пункты = ссылки тайла) */
    if (it.tile && it.tile.links && it.tile.links.length) {
      var sub = '<div class="nav__sub" id="nav-sub-' + it.id + '"><div class="nav__sub-in">'
        + it.tile.links.map(function (l) { return '<a class="nav__item" href="#"><span class="nav__label">' + l + '</span></a>'; }).join('')
        + '</div></div>';
      return '<a class="nav__item nav__item--acc" href="#" aria-expanded="false" aria-controls="nav-sub-' + it.id + '">'
        + '<span class="nav__ico">' + ic(it.icon) + '</span>'
        + '<span class="nav__label">' + it.label + '</span>'
        + '<span class="nav__caret">' + ic('chevron-down') + '</span></a>' + sub;
    }
    var badge = it.badge
      ? '<span class="nav__badge"><span class="badge badge--xs badge--accent" aria-hidden="true">' + it.badge + '</span></span>'
      : '';
    /* пункт «Текущий портфель» ведёт на реестр: со страницы сделки он остаётся
       рабочим переходом на уровень выше, а не мёртвой ссылкой */
    var href = '#';
    var sel = (it.id === SELECTED_ID) ? ' nav__item--selected" aria-current="page' : '';
    return '<a class="nav__item' + sel + '" href="' + href + '"><span class="nav__ico">' + ic(it.icon) + '</span>'
      + '<span class="nav__label">' + it.label + '</span>' + badge + '</a>';
  }

  function buildNav() {
    var nav = document.getElementById('nav');
    var s = '<div class="nav__top">'
      + '<button type="button" class="ibtn ibtn--neutral ibtn--m nav__burger" aria-label="Свернуть меню">' + ic('left-menu') + '</button>'
      + '<button type="button" class="ibtn ibtn--neutral ibtn--m nav__pin" aria-pressed="false" aria-label="Закрепить панель">' + ic('pin-menu') + '</button>'
      + '</div>';
    s += '<div class="nav__list">';
    s += '<a class="nav__item" href="#"><span class="nav__ico">' + ic('main-page') + '</span><span class="nav__label">Главная</span></a>';
    IBPHome.itemsFor(role).forEach(function (g, i) {
      s += '<div class="nav__block' + (i === 0 ? ' nav__block--first' : '') + '">';
      s += '<div class="nav__block-label">' + g.label + '</div>';
      g.items.forEach(function (it) { s += itemHTML(it); });
      s += '</div>';
    });
    s += '</div>';
    s += (window.IBPHome && window.IBPHome.footerHTML)
      ? window.IBPHome.footerHTML(role).replace(USER_LINK_FROM, USER_LINK_TO)
      : '<div class="nav__footer">'
        + '<a class="nav__user" href="../../../../../index.html" aria-label="Хаб проектов">'
        + '<span class="av av--circular av--m"><span class="av__text">АП</span></span>'
        + '<span class="nav__user-text">'
        + '<span class="nav__user-name">Александров Петр Константинович</span>'
        + '<span class="nav__user-role">' + role + '</span>'
        + '</span></a>'
        + '<button type="button" class="ibtn ibtn--neutral ibtn--m nav__logout" aria-label="Выйти">' + ic('logout') + '</button>'
        + '</div>';
    nav.innerHTML = s;
    if (window.DSNavPanel) window.DSNavPanel.bind(nav);
  }

  /* Сделка, которую открыли: номер приходит параметром ?id= — его ставит реестр
     текущего портфеля при двойном клике по строке. Данные читаются из общего
     DealsStore (той же базы, что рисует таблицу портфеля), поэтому наименование
     и номер на обоих экранах совпадают по построению. Открытие файла без
     параметра — просмотр каркаса: берётся первая сделка списка. */
  function currentDeal() {
    var id = null;
    try { id = new URLSearchParams(window.location.search).get('id'); } catch (e) { id = null; }
    var deal = (id != null && id !== '') ? window.DealsStore.byId(id) : null;
    return deal || window.DealsStore.byId('1028') || window.DealsStore.list()[0] || null;
  }

  /* Три чипа-статуса: сделка · Operations · ЦУП. Статус мониторинга на странице
     сделки не показывается (ТЗ 19.09.2026). Тон берётся из DealsStore.statusTone —
     того же словаря, что красит колонки статусов в реестре портфеля: словарь
     один, поэтому чип в таблице и чип в шапке не могут разойтись. */
  function fillChips(deal) {
    var box = document.getElementById('deal-chips');
    if (!box) return;
    var rows = [
      { value: deal.status, letter: '' },
      { value: deal.statusOps, letter: 'О' },
      { value: deal.statusTsup, letter: 'Ц' }
    ];
    box.innerHTML = rows.map(function (r) {
      if (!r.value) return '';
      var av = r.letter
        ? '<span class="chip__avatar av av--circular"><span class="av__text">' + esc(r.letter) + '</span></span>'
        : '';
      return '<span class="chip chip--rounded chip--s ' + window.DealsStore.statusTone(r.value) + '">'
        + av + '<span class="chip__label">' + esc(r.value) + '</span></span>';
    }).join('');
  }

  /* Подзаголовок шапки у погашенной сделки: тот же текст, что у строки узла
     дерева и сабхедера карточки ФИ (PRODUCT_DETAIL_LABELS.repaidAt), дата —
     repayDate записи сделки (ДД.ММ.ГГГГ). */
  function fillSubtitle(deal) {
    var box = document.getElementById('deal-subtitle');
    if (!box) return;
    var repaid = deal.status === 'Погашена';
    box.hidden = !repaid;
    if (!repaid) return;
    var label = (window.PRODUCT_DETAIL_LABELS || {}).repaidAt || 'Фактическая дата погашения';
    document.getElementById('deal-subtitle-text').textContent = label + (deal.repayDate ? ' ' + deal.repayDate : '');
  }

  /* Номер, под которым сделку открыли. Сторы КНР и дерева продуктов
     открыты по нему и держат его, даже если номер сменили в окне
     «Редактирование сделки»: DealsStore помнит прежний номер псевдонимом. */
  var openedId = null;

  function fillDeal() {
    var deal = currentDeal();
    if (!deal) return;
    openedId = String(deal.id);
    fillTitle(deal);
    fillChips(deal);
    fillSubtitle(deal);
    applyRoleMode();
    applyMode(deal);
    watchStatus(deal);
    fillKnr(deal);
    fillTerms(deal);
    fillTeam(deal);
    fillDescription(deal);
    fillFinMetrics(deal);
    fillProjectInfo(deal);
    fillProducts(deal);
    fillFinInstruments(deal);
    fillMetricsCalc(deal);
    fillNavigator(deal);
  }

  /* Заголовок «номер. наименование», третья крошка и заголовок вкладки —
     из записи сделки. Окно «Редактирование сделки» (DealTitleModal) модули
     не знают, связывает его страница: окно берёт номер и наименование при
     открытии, сверяет их с реестром через DealsStore.exists — исключая эту
     сделку — и отдаёт правку сюда, страница пишет её в стор, шапка
     перерисовывается по событию стора. Запись правится на месте, поэтому
     deal.id после смены номера — уже новый номер. */
  function paintTitle(d) {
    var num = 'Сделка № ' + d.id;
    document.getElementById('deal-title').textContent = d.id + '. ' + (d.name || '');
    paintCrumb(num);
    document.title = num + ' — IBP';
  }

  /* Текущая крошка. До привязки рантайма крошек (DOMContentLoaded) она ещё
     разметка экрана — #deal-crumb. Привязанный рантайм читает звенья один раз
     и перерисовывает список сам (#deal-crumb пропадает), поэтому после
     переименования текст меняется в его звеньях (api.items) и список
     перерисовывается (api.refresh) — ds-breadcrumbs.js. */
  function paintCrumb(text) {
    var cur = document.getElementById('deal-crumb');
    if (cur) { cur.textContent = text; return; }
    var ol = document.querySelector('[data-breadcrumbs]');
    var api = ol && window.DSBreadcrumbs ? window.DSBreadcrumbs.bind(ol) : null;
    if (!api || !api.items.length) return;
    api.items[api.items.length - 1].text = text;
    api.refresh();
  }

  function fillTitle(deal) {
    paintTitle(deal);
    window.DealsStore.on('change', function (d) {
      if (d && d.deal === deal) paintTitle(d.deal);
    });
  }

  /* Режим правки страницы. Статус сделки сильнее роли: в статусе, который не
     допускает правку сущностей (DealsStore.isEditable), вся страница — только
     просмотр, какой бы ни была роль. Режим — входной атрибут компонента
     (data-mode): его ставит страница, а свой вид в просмотре каждый компонент
     держит сам (действия правки не рисуются). Окно КНР — такой же компонент.
     Статус правку не закрыл — режимы остаются теми, что пришли с фрагментами.
     Кнопка переименования — разметка самого экрана, её прячет экран.

     Статус меняется на самой странице (тайл «Заведение сделки»), поэтому
     режим обратим: исходный режим компонента запоминается при первом проходе
     (data-mode-own) и возвращается, когда статус снова допускает правку
     («Ввод изменений», «Корректировка»). Навигатор режимом статуса не
     выключается: его действия — процесс, их задаёт статусная модель (в
     «Активной» сделку гасят и вводят изменения). Дерево продуктов и карточки
     ФИ кладут режим в разметку при отрисовке — после смены их перерисовывают. */
  function applyMode(deal) {
    var view = !window.DealsStore.isEditable(deal);
    var changed = false;
    /* карточки ФИ — тоже .tile[data-mode], но режим им ставит тайл при
       перерисовке ниже, а не этот проход */
    document.querySelectorAll('.screen__content .tile[data-mode]:not(.lc-fin-card)').forEach(function (el) {
      if (el.classList.contains('lc-navigator')) return;
      if (!el.hasAttribute('data-mode-own')) el.setAttribute('data-mode-own', el.getAttribute('data-mode'));
      var mode = view ? 'view' : el.getAttribute('data-mode-own');
      if (el.getAttribute('data-mode') !== mode) { el.setAttribute('data-mode', mode); changed = true; }
    });
    if (!changed) return;
    var tree = document.getElementById('tile-deal-products');
    if (tree && window.PostTileProductTree && window.ProductTreeStore && window.ProductTreeStore.dealId() != null) {
      window.PostTileProductTree.render(tree, window.ProductTreeStore.view());
    }
    var fi = document.getElementById('tile-fin-instruments');
    if (fi && fi.__fiPaint) fi.__fiPaint();
    /* вид тайла «Финансовые метрики» в просмотре — CSS, но доступность его
       кнопок (disabled) зависит от режима — перерисовать */
    var fm = document.getElementById('tile-fm-calc');
    if (fm && fm.__fmPaint) fm.__fmPaint();
  }

  /* Статусы сделки меняет тайл «Заведение сделки» — чипы шапки, подзаголовок
     погашенной сделки и режим правки следуют за записью в сторе. */
  function watchStatus(deal) {
    window.DealsStore.on('change', function (d) {
      if (!d || d.deal !== deal) return;
      fillChips(d.deal);
      fillSubtitle(d.deal);
      applyMode(d.deal);
    });
  }

  /* Тайл «Заведение сделки» (Navigator) — путь сделки по четырём дорожкам и
     действия текущего статуса, всё из статусной модели. Действие тайла
     отдаёт patch статусов сюда, страница пишет его в стор; тайл, чипы и
     режим перерисовываются по событию стора.

     Отметки чек-листа «Сделки» до «Согласования» — заполненность разделов
     (пояснение к «Черновику» в модели). Как мерить заполненность, макеты не
     говорят — допущение 10.10.2026 (паспорт тайла): «Общая информация» —
     есть дата заключения, «Продукты ДИД» — в дереве есть продукт ДИД,
     «Финансовые инструменты» — есть карточка ФИ, «Расчёт метрик» — у сделки
     есть метрики. Сторы дерева и ФИ открываются асинхронно — отметки
     пересчитываются по их событиям.

     Окна навигатора (назначение ответственного, отметки РМ/ПМ/ПМЗ, передача,
     погашение, причина изменений) открывает openModal по имени из поля modal
     перехода: окно берёт запись сделки и переход, по «Сохранить» отдаёт тайлу
     extra — patch полей сделки или отметку, тайл применяет переход вместе с
     ним. Крестик и Esc — перехода нет. Окна нет в реестре — переход сразу. */
  function fillNavigator(deal) {
    var tile = document.getElementById('tile-navigator');
    if (!tile || !window.PostNavigator) return;
    var trees = window.ProductTreeStore;
    var cards = window.FinInstrumentsStore;
    var metrics = window.MOCK_DEAL_FIN_METRICS || {};

    function progress(d) {
      var own = function (store) { return store && String(store.dealId()) === openedId; };
      return [
        !!String(d.signDate || '').trim(),
        own(trees) ? trees.view().length > 0 : (d.productsDidNames || []).length > 0,
        own(cards) ? cards.list().length > 0 : false,
        !!metrics[openedId]
      ];
    }

    function current() { return window.DealsStore.byId(deal.id) || deal; }

    var nav = window.PostNavigator.bind(tile, {
      get: current,
      /* Окон навигатора и перехода по статусам в концепте нет: действие статуса ничего не пишет в сделку. */
      save: function () {},
      progress: progress
    });
    window.DealsStore.on('change', function (d) {
      if (d && d.deal === deal) nav.paint();
    });
    [trees, cards].forEach(function (store) {
      if (!store) return;
      store.on('change', function (e) { if (e && e.reason === 'use') nav.paint(); });
      store.on('commit', nav.paint);
    });
  }

  /* Тайл «КНР» — КНР этой сделки из CounterpartiesStore. Пока состав
     грузится (сервер данных или localStorage, см. data/API.md), тайл стоит в
     loading. После «Сохранить» в окне КНР тайл перерисовывается сразу —
     таблица портфеля увидит то же при следующем открытии. */
  function fillKnr(deal) {
    var store = window.CounterpartiesStore;
    var tile = document.getElementById('tile-knr');
    if (!store || !tile || !window.PostTileKNR) return;
    function paint() { window.PostTileKNR.render(tile, store.knr()); }
    store.use(deal.id).then(paint);
    store.on('commit', paint);
  }

  /* Тайл «Сроки сделки» — даты этой сделки из DealsStore (signDate, endDate,
     firstDisb). Окно правки модули друг друга не знают — связывает их здесь
     страница: окно берёт даты сделки при открытии и отдаёт проверенную дату
     первой выдачи, страница пишет её в стор, тайл перерисовывается по событию
     стора. Хранение — в памяти вкладки, как у всего DealsStore. */
  function fillTerms(deal) {
    var tile = document.getElementById('tile-deal-terms');
    if (!tile || !window.PostTileDealTerms) return;
    window.PostTileDealTerms.render(tile, deal);
    window.DealsStore.on('change', function (d) {
      if (d && d.deal && String(d.deal.id) === String(deal.id)) window.PostTileDealTerms.render(tile, d.deal);
    });
  }

  /* Тайл «Команда сделки» — деск и роли этой сделки из DealsStore. Тайл
     показывает шесть ролей из тринадцати, остальные — в окне; оно же правит
     состав. Как и со сроками, модули друг друга не знают: окно берёт команду
     при открытии и отдаёт правку сюда, страница пишет её в стор, тайл
     перерисовывается по событию стора.

     Признак ограниченного доступа меняет только руководитель ЦУП (заказчик
     23.09.2026). Такой роли в каталоге ролей пока нет — в IBPHome объявлена
     одна, «Финансист ДИД», — поэтому право сейчас всегда закрыто и чекбокс в
     окне выключен. Появится роль — условие ниже заработает само; заводить её
     в ДС ради этого тайла не стали.

     Деск управляет третьим рядом страницы: сведения о проекте есть у сделок
     деска «Недвижимость». Решает это страница, а не тайлы — «Команда сделки»
     про «Сведения о проекте» ничего не знает. */
  function fillTeam(deal) {
    var tile = document.getElementById('tile-deal-team');
    if (!tile || !window.PostTileDealTeam) return;

    function paint(d) {
      window.PostTileDealTeam.render(tile, d);
      applyProjectInfo(d);
    }
    paint(deal);

    window.DealsStore.on('change', function (d) {
      if (d && d.deal && String(d.deal.id) === String(deal.id)) paint(d.deal);
    });
  }

  /* Тайл «Описание сделки» — поля описания этой сделки из DealsStore. Как со
     сроками и командой, модули друг друга не знают, связывает их страница:
       окно правки берёт запись при открытии и отдаёт правку сюда, страница
         пишет её в стор, тайл перерисовывается по событию стора;
       поповер «Связанные сделки» получает список сделки вместе с тайлом;
       окно «Документы ЭКД» берёт участников из CounterpartiesStore — того же
         состава, что правит окно «КНР». Пока состав этой сделки не загружен,
         окно показывает загрузку (members → null). */
  function fillDescription(deal) {
    var tile = document.getElementById('tile-deal-description');
    if (!tile || !window.PostTileDealDescription) return;

    function paint(d) { window.PostTileDealDescription.render(tile, d); }
    paint(deal);

    window.DealsStore.on('change', function (d) {
      if (d && d.deal && String(d.deal.id) === String(deal.id)) paint(d.deal);
    });
  }

  /* Тайл «Финансовые метрики сделки» — метрики этой сделки из
     mock-financial-metrics.js. Метрики считает система, в прототипе их
     никто не правит, поэтому стора и событий нет: страница один раз отдаёт
     метрики тайлу и окну. Нет записи — «Нет данных»; сделка из списка
     MOCK_DEAL_FIN_METRICS_FAILED — ошибка запроса. Окно берёт метрики при
     открытии тем же путём. */
  function fillFinMetrics(deal) {
    var tile = document.getElementById('tile-deal-fin-metrics');
    if (!tile || !window.PostTileDealFinMetrics) return;
    var all = window.MOCK_DEAL_FIN_METRICS || {};
    var failed = (window.MOCK_DEAL_FIN_METRICS_FAILED || []).some(function (id) { return String(id) === String(deal.id); });
    var metrics = failed ? null : (all[String(deal.id)] || null);

    window.PostTileDealFinMetrics.render(tile, metrics, { failed: failed });
  }

  /* Тайл «Сведения о проекте» — сведения этой сделки из DealsStore
     (deal.projectInformation). Как у описания сделки, модули друг друга не
     знают, связывает их страница: окно правки берёт сведения при открытии и
     отдаёт правку сюда, страница пишет её в стор, тайл перерисовывается по
     событию стора. Показывать ли ряд — решает applyProjectInfo по деску. */
  function fillProjectInfo(deal) {
    var tile = document.getElementById('tile-project-info');
    if (!tile || !window.PostTileProjectInformation) return;

    function paint(d) { window.PostTileProjectInformation.render(tile, d.projectInformation || null); }
    paint(deal);

    window.DealsStore.on('change', function (d) {
      if (d && d.deal && String(d.deal.id) === String(deal.id)) paint(d.deal);
    });
  }

  /* Тайл «Продукты сделки» — дерево продуктов этой сделки из ProductTreeStore
     (../data/product-tree-store.js поверх mock-deal-trees.js). Тайл связывает
     со стором его собственный скрипт: перерисовка после «Сохранить» в окнах,
     звезда основного продукта и «Удалить» — через стор. Окна «Продукты ДИД»,
     «Продукты» и подтверждение удаления слушают события тайла сами, здесь их
     не связывают. Режим (data-mode) тайлу уже поставил applyMode по статусу
     сделки — render читает его с корня. Хранение — в памяти вкладки. */
  /* Дерево сделки — после загрузки сохранённых деревьев (PostApi): до этого
     тайл стоит в «Загрузке», как его вшила метка. */
  function fillProducts(deal) {
    var store = window.ProductTreeStore;
    var tile = document.getElementById('tile-deal-products');
    if (!store || !tile || !window.PostTileProductTree) return;
    store.ready.then(function () {
      store.use(deal.id);
      window.PostTileProductTree.bind(tile, store);
    });
  }

  /* Тайл «Финансовые инструменты» — карточки ФИ этой сделки из
     FinInstrumentsStore (../data/fin-instruments-store.js поверх
     mock-fin-instruments.js). Баланс, валюта, суммы и инструменты карточки
     — из узлов дерева продуктов, прикреплённых к ней, поэтому стор ФИ
     открывается после стора дерева. Тайл связывает со сторами его
     собственный скрипт: перерисовка после «Сохранить» в окнах ФИ и в окне
     связи с ФИ у дерева. Окна создания и изменения слушают события тайла
     сами. Режим (data-mode) тайлу уже поставил applyMode. До загрузки
     сохранённых карточек и деревьев тайл стоит в «Загрузке». */
  function fillFinInstruments(deal) {
    var store = window.FinInstrumentsStore;
    var trees = window.ProductTreeStore;
    var tile = document.getElementById('tile-fin-instruments');
    if (!store || !tile || !window.PostTileFinInstruments) return;
    Promise.all([store.ready, trees ? trees.ready : null, window.CounterpartiesStore ? window.CounterpartiesStore.ready : null])
      .then(function () {
        store.use(deal.id);
        window.PostTileFinInstruments.bind(tile, store);
      });
  }

  /* Тайл «Финансовые метрики» — расчёт метрик этой сделки из FinMetricsStore
     (../data/fin-metrics-store.js поверх mock-fin-metrics-calc.js). Стор
     считает по карточкам ФИ сделки, поэтому открывается после стора ФИ — в
     том же порядке, что у fillFinInstruments. Тайл связывает со сторами его
     собственный скрипт: перерисовка по расчёту и по изменению карточек ФИ,
     «Рассчитать» и «Пересчет метрик» — store.calculate(), снеки по исходу.
     Режим (data-mode) тайлу уже поставили applyRoleMode и applyMode, вид в
     просмотре тайл держит сам. До загрузки тайл стоит в «Загрузке». */
  function fillMetricsCalc(deal) {
    var store = window.FinMetricsStore;
    var cards = window.FinInstrumentsStore;
    var trees = window.ProductTreeStore;
    var tile = document.getElementById('tile-fm-calc');
    if (!store || !cards || !tile || !window.PostTileMetricsCalc) return;
    Promise.all([store.ready, cards.ready, trees ? trees.ready : null, window.CounterpartiesStore ? window.CounterpartiesStore.ready : null])
      .then(function () {
        if (String(cards.dealId()) !== openedId) cards.use(deal.id);
        store.use(deal.id);
        /* нераспределённая дельта РСБУ — предупреждение перед пересчётом (RE0034, Э5) */
        window.PostTileMetricsCalc.bind(tile, store, {
          confirm: function (un) {
            if (!window.PostRsbuRecalcWarning) return Promise.resolve(true);
            var hit = cards.view().filter(function (c) { return c.id === un.fiId; })[0];
            return window.PostRsbuRecalcWarning.open({ amount: un.amount, currencyCode: un.currencyCode, fiName: hit ? hit.name : un.fiId, date: un.date });
          }
        });
      });
  }

  /* Просмотр по роли. Режим тайла «Финансовые метрики» зависит и от статуса
     сделки, и от роли (ответ человека 20.10.2026, RE0033). Ролей с разными
     правами в каталоге пока нет, поэтому роль без права на расчёт показывает
     сценарий панели: ?fmMode=view. Ставится до applyMode — тот запомнит его
     исходным режимом тайла (data-mode-own), и смена статуса его не вернёт
     в правку. Так же устроен ?hardsMode=view у Tranche.html. */
  function applyRoleMode() {
    if (!/[?&]fmMode=view/.test(window.location.search)) return;
    var tile = document.getElementById('tile-fm-calc');
    if (tile) tile.setAttribute('data-mode', 'view');
  }

  /* Действия тайла «Финансовые метрики»: тайл шлёт 'fmcalcaction', куда идти,
     знает страница. REPORTS («Отчеты →») — страница финансовых метрик этой
     сделки (FinancialMetrics, RE0033 Э4). FIXATION — окно фиксации ЭПС/ВБС
     (PostFixationModal, RE0033 Э6): готовая фиксация приходит в FinMetricsStore,
     тайл обновляется по его событию. */
  document.addEventListener('fmcalcaction', function (e) {
    var d = e.detail || {};
    if (d.action === 'FIXATION') {
      if (window.PostFixationModal) window.PostFixationModal.open();
      return;
    }
    if (d.action !== 'REPORTS') return;
    var page = /\.preview\.html$/.test(window.location.pathname) ? 'FinancialMetrics.preview.html' : 'FinancialMetrics.html';
    window.location.href = page + '?id=' + encodeURIComponent(openedId);
  });

  /* Куда ведёт узел дерева или карточки ФИ — одно место на странице. Правило
     «есть страница» — флаг hasPage каталога типов; в концепте собрана только
     страница транша. */
  function nodePage(node) {
    if (!node || node.hasPage !== true || node.kind !== 'TRANCHE') return null;
    var page = /\.preview\.html$/.test(window.location.pathname) ? 'Tranche.preview.html' : 'Tranche.html';
    return page + '?id=' + encodeURIComponent(openedId) + '&tr=' + encodeURIComponent(node.id);
  }

  /* Название транша в дереве продуктов — переход на страницу транша: тайл шлёт
     'ptreeaction' OPEN, куда идти, знает та же функция адреса узла. */
  document.addEventListener('ptreeaction', function (e) {
    var d = e.detail || {};
    if (d.action !== 'OPEN') return;
    var href = nodePage(d.node);
    if (href) window.location.href = href;
  });

  /* Заголовок связанного транша в карточке ФИ — тот же переход: тайл шлёт
     'fiaction' OPEN_NODE. Стрелка «→» карточки в концепте скрыта
     (hideDeadActions): страницы ФИ здесь нет. */
  document.addEventListener('fiaction', function (e) {
    var d = e.detail || {};
    if (d.action !== 'OPEN_NODE') return;
    var node = d.id && window.ProductTreeStore ? window.ProductTreeStore.node(d.id) : null;
    var href = nodePage(node);
    if (href) window.location.href = href;
  });

  /* Ряд «Сведения о проекте» — только у деска «Недвижимость»: это проекты
     недвижимости (заказчик 23.09.2026). Ряд прячется целиком, а не пустым
     тайлом: пустой тайл читался бы как «данных нет». */
  function applyProjectInfo(deal) {
    var row = document.getElementById('row-project-info');
    if (!row) return;
    row.hidden = String((deal && deal.desk) || '').trim() !== 'Недвижимость';
  }

  /* Сворачивание блока «Общая информация». Рантайм ds-tile.js сюда не подходит:
     он ищет closest('.tile'), а заголовок раздела стоит на фоне страницы. */
  function bindSection() {
    var toggle = document.querySelector('.gen__toggle');
    var body = document.getElementById('gen-body');
    if (!toggle || !body) return;
    toggle.addEventListener('click', function () {
      var open = toggle.getAttribute('aria-expanded') === 'true';
      toggle.setAttribute('aria-expanded', String(!open));
      toggle.setAttribute('aria-label', open ? 'Развернуть' : 'Свернуть');
      body.hidden = open;
    });
  }

  /* Табы: roving tabindex, стрелки и переполнение даёт рантайм ДС, а показ
     нужной панели — модель данных экрана, рантайма для неё в ДС нет
     (design-system/specs/_runtime-hooks.md, «Чего рантаймы не делают»). */
  function bindTabs() {
    var bar = document.getElementById('deal-tabs');
    if (!bar || !window.DSTabs) return;
    var panels = Array.prototype.slice.call(document.querySelectorAll('[data-tabpanel]'));
    window.DSTabs.tabs(bar, {
      onChange: function (index) {
        panels.forEach(function (p, i) { p.hidden = (i !== index); });
      }
    });
  }

  /* Кнопки и ссылки в разметке тайлов, которые открывают окна, поповер или страницу ФИ, — этих
     окон и страницы в концепте нет, а мёртвая кнопка читается как сломанная. Прячем атрибутом hidden.
     Карточки ФИ рисует тайл при открытии сторов и при их изменении, поэтому проход повторяется. */
  function hideDeadActions() {
    document.querySelectorAll('[data-modal]').forEach(function (el) {
      if (document.getElementById(el.getAttribute('data-modal'))) return;
      el.hidden = true;
      el.removeAttribute('data-modal');
      el.removeAttribute('data-modal-guarded');
    });
    document.querySelectorAll('[data-popover]').forEach(function (el) {
      if (document.getElementById(el.getAttribute('data-popover'))) return;
      el.hidden = true;
      el.removeAttribute('data-popover');
    });
    document.querySelectorAll('[data-fi-act="OPEN"]').forEach(function (el) { el.hidden = true; });
  }

  function watchDeadActions() {
    var cards = window.FinInstrumentsStore;
    if (!cards) return;
    cards.on('change', hideDeadActions);
    cards.on('commit', hideDeadActions);
    cards.ready.then(function () { setTimeout(hideDeadActions, 0); });
  }

  function paintAll() {
    hideDeadActions();
    watchDeadActions();
    if (window.dsIcons) window.dsIcons.apply(document);
  }

  buildNav(); fillDeal(); bindSection(); bindTabs(); paintAll();
})();
</script>

</body>
</html>
