<!DOCTYPE html>
<!--
  ИСТОЧНИК страницы «Финансовые метрики». Двойным кликом открывают НЕ этот файл, а собранный
  FinancialMetrics.preview.html: таблицы отчётов и окно фильтра стоят здесь метками <ds-include>,
  а рантайм-инклуд ДС тянет фрагменты через fetch, который по file:// не работает.

    node .agents/tools/assemble.mjs        — пересобрать после правки любого виджета

  Страница держит шапку, вкладки и связь виджетов со сторами; разметка таблиц и окна фильтра —
  в их папках apps/postrade/drafts/tranche-page-v03/widgets/. Адрес: FinancialMetrics.html?id=<номер сделки>.
  Концепт v3 (RE0034): копия страницы модуля deals-app от 22.10.2026; без ?id= открывается сделка 1028.
-->
<html lang="ru">
<head>
<script src="../../../../ds-config.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Финансовые метрики — IBP</title>
<!-- @lc-css --><!-- сюда ассемблер вставляет CSS подключённых локальных компонентов -->
<style>
  /* ---------- только раскладка экрана, на токенах ДС ---------- */
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  body { margin: 0; font-family: var(--font-text), system-ui, sans-serif; color: var(--text-primary); background: var(--bg-page); }

  /* Ритм 12px между шапкой, вкладками и таблицей (как у подстраницы модуля). */
  .screen__content { gap: var(--space-12); }

  /* Панель вкладки занимает оставшуюся высоту .screen--app, а таблица (.dtable--fill)
     внутри неё — высоту панели: цепочка flex:1 + min-height:0 от экрана до тела таблицы,
     скролл только у тела таблицы. Парное [hidden] — соглашение ДС: display у класса иначе
     перебивает UA-правило [hidden]. */
  .fm-panel { display: flex; flex-direction: column; flex: 1 1 auto; min-width: 0; min-height: 0; }
  .fm-panel[hidden] { display: none; }
  .fm-panel > .lc-financial-metrics-table,
  .fm-panel > .lc-kpi-table,
  .fm-panel > .lc-fixation-history-table { flex: 1 1 auto; min-height: 0; }
  /* Тело карточек «Отчет KPI» и «История фиксаций» (Tile) само по высоте не тянется — её растягивает страница. */
  .fm-panel > .lc-kpi-table > .tile__body,
  .fm-panel > .lc-fixation-history-table > .tile__body { flex: 1 1 auto; }
</style>
</head>
<body>

<div class="nav-layout">

  <!-- Боковое меню строится экранным скриптом из ibp-home.js по роли -->
  <nav class="nav nav--rail" id="nav" aria-label="Главное меню"></nav>

  <div class="screen screen--app">

    <!-- Крошки: Главная / Текущий портфель ДИД / «<номер>. <название сделки>» / Финансовые метрики.
         Третье звено (текст и ссылку) заполняет экранный скрипт из записи сделки. -->
    <nav class="crumbs" aria-label="Хлебные крошки" data-breadcrumbs>
      <li class="crumbs__item"><a class="link link--muted" href="#">Главная</a></li>
      <li class="crumbs__item"><a class="link link--muted" href="#">Текущий портфель ДИД</a></li>
      <li class="crumbs__item"><a class="link link--muted" href="Deal.html" id="fm-crumb-deal">Сделка</a></li>
      <li class="crumbs__item crumbs__item--current">
        <span class="crumbs__current" aria-current="page">Финансовые метрики</span>
      </li>
    </nav>

    <main class="screen__content">

      <!-- #sec:head ── Шапка страницы ─────────────────────────────────────────
           Подзаголовок «Последний расчет: …» заполняет скрипт по FinMetricsStore.state().
           Действия: «Фиксация ЭПС/ВБС» и «Пересчет метрик» — до загрузки сторов выключены
           (disabled), дальше доступность ставит скрипт по режиму, расчёту и состоянию стора;
           кебаб с «Выгрузить в XLSX» стоит выше вкладок и от них не зависит. -->
      <div class="phead">
        <div class="phead__main">
          <div class="phead__title-row">
            <div class="phead__title-group">
              <h1 class="phead__title">Финансовые метрики</h1>
            </div>
            <span class="phead__return"><a class="btn btn--outline btn--xs" href="Deal.html" id="fm-return"><i data-icon="flip-backward"></i><span class="btn__label">В сделку</span></a></span>
          </div>
          <div class="phead__subtitle" id="fm-subtitle" hidden>
            <span id="fm-subtitle-text"></span>
          </div>
        </div>
        <div class="phead__actions">
          <button type="button" class="btn btn--outline btn--m" id="fm-fixation" data-fm-act="FIXATION" disabled><span class="btn__label">Фиксация ЭПС/ВБС</span></button>
          <button type="button" class="btn btn--outline btn--m" id="fm-calc" data-fm-act="CALCULATE" disabled><span class="btn__label">Пересчет метрик</span></button>
          <span class="menu-anchor">
            <button type="button" class="btn btn--outline btn--m btn--icon-only" id="fm-menu-btn" aria-label="Ещё действия" aria-haspopup="menu" aria-expanded="false" data-menu="fm-menu" data-menu-align="end" disabled><i data-icon="more-dots"></i></button>
            <div id="fm-menu" class="menu menu--floating" role="menu" hidden>
              <button type="button" class="menu__item" role="menuitem" id="fm-export" data-fm-act="EXPORT">
                <span class="menu__item-icon"><i data-icon="download"></i></span>
                <span class="menu__item-label">Выгрузить в XLSX</span>
              </button>
            </div>
          </span>
        </div>
      </div>

      <!-- #sec:content ── Вкладки отчётов ───────────────────────────────────── -->
      <div class="tabs tabs--horiz" role="tablist" id="fm-tabs" data-tabs>
        <button type="button" class="tab tab--m tab--selected" role="tab" id="tab-ifrs" data-fm-tab="IFRS"
                aria-selected="true" aria-controls="panel-ifrs" tabindex="0">
          <span class="tab__label">МСФО</span>
        </button>
        <button type="button" class="tab tab--m" role="tab" id="tab-ras" data-fm-tab="RAS"
                aria-selected="false" aria-controls="panel-ras" tabindex="-1">
          <span class="tab__label">РСБУ</span>
        </button>
        <button type="button" class="tab tab--m" role="tab" id="tab-kpi" data-fm-tab="KPI"
                aria-selected="false" aria-controls="panel-kpi" tabindex="-1">
          <span class="tab__label">KPI</span>
        </button>
        <button type="button" class="tab tab--m" role="tab" id="tab-fixations" data-fm-tab="FIXATIONS"
                aria-selected="false" aria-controls="panel-fixations" tabindex="-1">
          <span class="tab__label">Фиксации ЭПС/ВБС</span><span class="tab__badge" id="fm-fixations-badge" hidden></span>
        </button>
      </div>

      <!-- МСФО и РСБУ — один виджет на обе вкладки; data-report на корень ставит его скрипт -->
      <div class="fm-panel" id="panel-ifrs" role="tabpanel" aria-labelledby="tab-ifrs" data-tabpanel data-fm-tab="IFRS">
        <ds-include src="../widgets/tables/FinancialMetricsTable/FinancialMetricsTable.html" id="fm-table-ifrs"></ds-include>
      </div>
      <div class="fm-panel" id="panel-ras" role="tabpanel" aria-labelledby="tab-ras" data-tabpanel data-fm-tab="RAS" hidden>
        <ds-include src="../widgets/tables/FinancialMetricsTable/FinancialMetricsTable.html" id="fm-table-ras"></ds-include>
      </div>
      <div class="fm-panel" id="panel-kpi" role="tabpanel" aria-labelledby="tab-kpi" data-tabpanel data-fm-tab="KPI" hidden>
        <ds-include src="../widgets/tables/KPITable/KPITable.html" class="col-12" id="fm-table-kpi"></ds-include>
      </div>

      <!-- «Фиксации ЭПС/ВБС» — история фиксаций (FixationHistoryTable): «По ФИ» / «По дате»,
           корзина в строке шлёт fmfixationaction, удаление и подтверждение — на странице. -->
      <div class="fm-panel" id="panel-fixations" role="tabpanel" aria-labelledby="tab-fixations" data-tabpanel data-fm-tab="FIXATIONS" hidden>
        <ds-include src="../widgets/tables/FixationHistoryTable/FixationHistoryTable.html" class="col-12" id="fm-table-fixations"></ds-include>
      </div>

    </main>
  </div>
</div>

<!-- #sec:modals ── Окно «Фильтр»: одно на все вкладки отчётов (скрим fm-filter-scrim).
     Окно «Фиксация ЭПС/ВБС» (скрим fm-fix-scrim) — с подтверждением незавершённого
     предварительного расчёта (fm-fix-confirm-scrim) и шаблоном карточки фиксации.
     Окно «Выгрузка отчета» (скрим fm-download-scrim) — одно на страницу: с шифрованием или без
     по сети (?net=sigma), «Выгрузить в XLSX» открывает его. -->
<ds-include src="../widgets/modals/FinancialMetricsFilterModal/FinancialMetricsFilterModal.html"></ds-include>
<ds-include src="../widgets/modals/FixationModal/FixationModal.html"></ds-include>
<ds-include src="../widgets/modals/FixationModal/FixationConfirmModal.html"></ds-include>
<ds-include src="../widgets/modals/FixationModal/FixationModalTile/FixationModalTile.html"></ds-include>
<ds-include src="../widgets/modals/FinancialMetricsDownloadReportModal/FinancialMetricsDownloadReportModal.html"></ds-include>
<!-- Окно предупреждения «Пересчитать метрики?» — открывается, если при пересчёте у зафиксированного
     индикатора РСБУ осталась нераспределённая сумма (RE0034, Э5) -->
<ds-include src="../widgets/modals/RsbuRecalcWarningModal/RsbuRecalcWarningModal.html"></ds-include>

<!-- Подтверждение действия: одно на страницу (скрим fm-confirm-scrim); текст и действие подставляет
     скрипт функцией confirmAction. Им подтверждается удаление фиксации; у окна фиксации своё
     подтверждение (fm-fix-confirm-scrim): окно открывается и на странице сделки. -->
<div class="modal-scrim" id="fm-confirm-scrim" hidden>
  <div class="modal modal--w4" role="dialog" aria-modal="true" aria-labelledby="fm-confirm-title">
    <header class="modal__head">
      <h2 class="modal__title" id="fm-confirm-title">Подтверждение действия</h2>
      <button type="button" class="ibtn ibtn--neutral ibtn--l" aria-label="Закрыть" data-modal-close><i data-icon="close"></i></button>
    </header>
    <div class="modal__body">
      <div id="fm-confirm-text"></div>
    </div>
    <footer class="modal__foot">
      <div class="modal__foot-right">
        <button type="button" class="btn btn--transparent btn--m" data-modal-close><span class="btn__label">Отменить</span></button>
        <button type="button" class="btn btn--accent btn--m" id="fm-confirm-ok"><span class="btn__label">Подтвердить</span></button>
      </div>
    </footer>
  </div>
</div>

<!-- данные: порядок как у Deal.html. Стор метрик читает ФИ сделки из стора ФИ, а тот — узлы
     дерева сделки, поэтому деревья и ФИ раньше расчёта -->
<script src="../data/mock-deals.js"></script>
<script src="../data/deal-status-model.js"></script>
<script src="../data/deals-store.js"></script>
<script src="../data/mock-team.js"></script>
<script src="../data/mock-counterparties.js"></script>
<script src="../data/post-api.js"></script>
<script src="../data/counterparties-store.js"></script>
<script src="../data/mock-financial-metrics.js"></script>
<script src="../data/mock-product-catalog.js"></script>
<script src="../data/mock-fin-instruments.js"></script>
<script src="../data/mock-deal-trees.js"></script>
<script src="../data/product-tree-store.js"></script>
<script src="../data/fin-instruments-store.js"></script>
<script src="../data/mock-fin-metrics-calc.js"></script>
<script src="../data/fin-metrics-store.js"></script>
<script src="../data/fin-metrics-notify.js"></script>
<script src="../data/mock-report-employees.js"></script>
<script src="../../../../ds-body.js" data-ds="patterns/HomeRoles/ibp-home.js"></script>
<!-- виджеты: FinancialMetricsTable.js раньше KPITable.js и FixationHistoryTable.js (те строятся на нём) -->
<script src="../widgets/tables/FinancialMetricsTable/FinancialMetricsTable.js"></script>
<script src="../widgets/tables/KPITable/KPITable.js"></script>
<script src="../widgets/tables/FixationHistoryTable/FixationHistoryTable.js"></script>
<script src="../widgets/modals/FinancialMetricsFilterModal/FinancialMetricsFilterModal.js"></script>
<script src="../widgets/modals/FixationModal/FixationModal.js"></script>
<script src="../widgets/modals/FinancialMetricsDownloadReportModal/FinancialMetricsDownloadReportModal.js"></script>
<script src="../widgets/modals/RsbuRecalcWarningModal/RsbuRecalcWarningModal.js"></script>
<script>
/* Экранный скрипт. Делает только то, чего рантаймы ДС не делают: меню по каталогу ролей,
   данные сделки (крошки, шапка), связь таблиц и окна фильтра с FinMetricsStore, переключение
   панелей вкладок (DSTabs.tabs — как на Deal.html: синхронно после ds-body.js, раньше
   автопривязки на DOMContentLoaded), пересчёт метрик, доступность кнопок шапки, удаление
   фиксации ЭПС/ВБС с подтверждением.
   Фильтры вкладок живут в памяти страницы (вопрос 11 задачи RE0033 открыт). */
(function () {
  'use strict';
  var role = window.IBPHome.defaultRole;
  var SELECTED_ID = 'current-portfolio';
  var USER_LINK_FROM = ' href="#" aria-label="Открыть личный кабинет"';
  var USER_LINK_TO = ' href="../../../../../index.html" aria-label="Хаб проектов"';
  var TABS = ['IFRS', 'RAS', 'KPI'];

  function ic(name) { return '<i data-icon=\'' + name + '\'></i>'; }
  function $(id) { return document.getElementById(id); }

  /* ---------- боковое меню ---------- */
  function itemHTML(it) {
    var badge = it.badge
      ? '<span class="nav__badge"><span class="badge badge--xs badge--accent" aria-hidden="true">' + it.badge + '</span></span>'
      : '';
    var href = '#';
    var sel = (it.id === SELECTED_ID) ? ' nav__item--selected" aria-current="page' : '';
    return '<a class="nav__item' + sel + '" href="' + href + '"><span class="nav__ico">' + ic(it.icon) + '</span>'
      + '<span class="nav__label">' + it.label + '</span>' + badge + '</a>';
  }

  function buildNav() {
    var nav = $('nav');
    var s = '<div class="nav__top">'
      + '<button type="button" class="ibtn ibtn--neutral ibtn--m nav__burger" aria-label="Свернуть меню">' + ic('left-menu') + '</button>'
      + '<button type="button" class="ibtn ibtn--neutral ibtn--m nav__pin" aria-pressed="false" aria-label="Закрепить панель">' + ic('pin-menu') + '</button>'
      + '</div><div class="nav__list">'
      + '<a class="nav__item" href="#"><span class="nav__ico">' + ic('main-page') + '</span><span class="nav__label">Главная</span></a>';
    window.IBPHome.itemsFor(role).forEach(function (g, i) {
      s += '<div class="nav__block' + (i === 0 ? ' nav__block--first' : '') + '"><div class="nav__block-label">' + g.label + '</div>';
      g.items.forEach(function (it) { s += itemHTML(it); });
      s += '</div>';
    });
    s += '</div>' + (window.IBPHome.footerHTML
      ? window.IBPHome.footerHTML(role).replace(USER_LINK_FROM, USER_LINK_TO)
      : '<div class="nav__footer">'
        + '<a class="nav__user" href="../../../../../index.html" aria-label="Хаб проектов">'
        + '<span class="av av--circular av--m"><span class="av__text">АП</span></span>'
        + '<span class="nav__user-text"><span class="nav__user-name">Александров Пётр</span>'
        + '<span class="nav__user-role">' + role + '</span></span></a>'
        + '<button type="button" class="ibtn ibtn--neutral ibtn--m nav__logout" aria-label="Выйти">' + ic('logout') + '</button>'
        + '</div>');
    nav.innerHTML = s;
    if (window.DSNavPanel) window.DSNavPanel.bind(nav);
  }

  /* ---------- сделка: номер приходит параметром ?id=, как на Deal.html ---------- */
  function currentDeal() {
    var id = null;
    try { id = new URLSearchParams(window.location.search).get('id'); } catch (e) { id = null; }
    var deal = (id != null && id !== '') ? window.DealsStore.byId(id) : null;
    return deal || window.DealsStore.byId('1028') || window.DealsStore.list()[0] || null;
  }

  var deal = currentDeal();
  var openedId = deal ? String(deal.id) : '';
  var preview = /\.preview\.html$/.test(window.location.pathname);
  var DEAL_PAGE = (preview ? 'Deal.preview.html' : 'Deal.html');
  var dealHref = DEAL_PAGE + (openedId ? '?id=' + encodeURIComponent(openedId) : '');

  /* Просмотр: статус сделки не допускает правку (DealsStore.isEditable) либо сценарий панели
     ?fmMode=view — роль без права на расчёт и фиксацию (как на Deal.html). */
  var roleView = /[?&]fmMode=view/.test(window.location.search);
  function isView() { return roleView || !(deal && window.DealsStore.isEditable(deal)); }

  /* ---------- шапка и крошки ---------- */
  function paintCrumbs() {
    var ol = document.querySelector('[data-breadcrumbs]');
    var label = deal ? deal.id + '. ' + (deal.name || '') : 'Сделка';
    $('fm-return').setAttribute('href', dealHref);
    var api = window.DSBreadcrumbs && ol ? window.DSBreadcrumbs.bind(ol) : null;
    if (api && api.items[2]) {
      api.items[2].text = label;
      api.items[2].href = dealHref;
      api.refresh();
      return;
    }
    var a = $('fm-crumb-deal');
    if (a) { a.textContent = label; a.setAttribute('href', dealHref); }
  }

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  /* ISO → «ДД.ММ.ГГГГ, ЧЧ:ММ» по местному времени (как в тайле «Финансовые метрики») */
  function formatAt(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    return pad(d.getDate()) + '.' + pad(d.getMonth() + 1) + '.' + d.getFullYear() + ', ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  var store = window.FinMetricsStore;
  var Table = window.PostFinMetricsTable;
  var Kpi = window.PostKpiTable;
  var Fix = window.PostFixationHistoryTable;
  var Filter = window.PostFinMetricsFilter;

  function noFilter() { return Filter ? Filter.empty() : { fiIds: [], metrics: {} }; }
  var filters = { IFRS: noFilter(), RAS: noFilter(), KPI: noFilter() };
  var loaded = false;


  /* Недоступное действие выключается атрибутом, а не только прячется (урок Л235). */
  function setEnabled(el, on) {
    el.disabled = !on;
    if (on) el.removeAttribute('aria-disabled'); else el.setAttribute('aria-disabled', 'true');
  }

  /* Лоадер на кнопке — разметка Buttons ДС (btn--loading + spin--current). */
  function setLoading(btn, on) {
    var spin = btn.querySelector('.spin');
    btn.classList.toggle('btn--loading', on);
    if (on) {
      btn.setAttribute('aria-busy', 'true');
      if (!spin) {
        spin = document.createElement('span');
        spin.className = 'spin spin--current';
        btn.insertBefore(spin, btn.firstChild);
      }
    } else {
      btn.removeAttribute('aria-busy');
      if (spin) spin.remove();
    }
  }

  function paintHeader() {
    if (!loaded) return;
    var s = store.state();
    var view = isView();
    var busy = !!s.busy;

    var sub = $('fm-subtitle');
    var at = s.calculated ? formatAt(s.calculatedAt) : '';
    sub.hidden = !at;
    $('fm-subtitle-text').textContent = at ? 'Последний расчет: ' + at : '';

    var fix = $('fm-fixation');
    var calc = $('fm-calc');
    fix.hidden = view;
    setEnabled(fix, !view && !busy && s.code !== 'LOCKED');
    calc.hidden = view;
    setEnabled(calc, !view && !busy && s.code !== 'LOCKED');
    setLoading(calc, busy && !view);

    setEnabled($('fm-menu-btn'), !busy);
    setEnabled($('fm-export'), !busy);

    /* «В сделку» — ссылка: запрещённая теряет href (Л235) */
    var back = $('fm-return');
    if (busy) {
      back.removeAttribute('href');
      back.setAttribute('aria-disabled', 'true');
      back.setAttribute('tabindex', '-1');
      back.classList.add('btn--disabled');
    } else {
      back.setAttribute('href', dealHref);
      back.removeAttribute('aria-disabled');
      back.removeAttribute('tabindex');
      back.classList.remove('btn--disabled');
    }
  }

  /* ---------- вкладки ---------- */
  function paintTabs() {
    if (!loaded) return;
    store.reportTabs().forEach(function (t) {
      var tab = document.querySelector('#fm-tabs [data-fm-tab="' + t.code + '"]');
      if (!tab) return;
      var label = tab.querySelector('.tab__label');
      if (label && t.label) label.textContent = t.label;
    });
    var fixTab = store.reportTabs().filter(function (t) { return t.code === 'FIXATIONS'; })[0];
    var badge = $('fm-fixations-badge');
    var count = fixTab && fixTab.count ? fixTab.count : 0;
    badge.textContent = count > 0 ? String(count) : '';
    badge.hidden = !(count > 0);
  }

  function bindTabs() {
    var bar = $('fm-tabs');
    if (!bar || !window.DSTabs) return;
    var panels = Array.prototype.slice.call(document.querySelectorAll('[data-tabpanel]'));
    window.DSTabs.tabs(bar, {
      onChange: function (index) {
        panels.forEach(function (p, i) { p.hidden = (i !== index); });
      }
    });
  }

  /* ---------- отчёты ---------- */
  var ROOTS = { IFRS: 'fm-table-ifrs', RAS: 'fm-table-ras', KPI: 'fm-table-kpi', FIXATIONS: 'fm-table-fixations' };

  /* После пересчёта состав ФИ и индикаторов мог измениться: из фильтра уходит то, чего нет. */
  function pruneFilter(tab) {
    var ind = store.indicators(tab);
    filters[tab] = Filter ? Filter.normalize(filters[tab], ind) : noFilter();
    return filters[tab];
  }

  /* ФИ отчёта РСБУ с траншем — им доступна фиксация; в просмотре и во время расчёта действий нет. */
  function rasFiIds() {
    var inReport = {};
    store.report('RAS').groups.forEach(function (g) { inReport[g.financialInstrumentId] = true; });
    return store.trancheFiIds().filter(function (id) { return inReport[id]; });
  }
  function rasOpts() {
    return { ras: {
      canFix: rasFiIds(), fixation: store.rasFixation(), moves: store.rasMoves(),
      readOnly: isView() || !!store.state().busy
    } };
  }

  function renderTab(tab) {
    var root = $(ROOTS[tab]);
    if (!root || !loaded) return;
    if (tab === 'FIXATIONS') {
      /* фильтра у вкладки нет; корзины — по режиму (просмотр: колонки нет) и по пересчёту (disabled) */
      Fix.render(root, store.fixations(), { mode: isView() ? 'view' : 'edit', busy: !!store.state().busy });
      return;
    }
    var f = pruneFilter(tab);
    if (tab === 'KPI') {
      Kpi.render(root, { KPI_SHORT: store.report('KPI_SHORT'), KPI_FULL: store.report('KPI_FULL') }, f);
    } else {
      Table.render(root, store.report(tab), f, tab === 'RAS' ? rasOpts() : null);
    }
  }

  function refreshAll() {
    paintHeader();
    paintTabs();
    TABS.forEach(renderTab);
    renderTab('FIXATIONS');
  }

  function tabOf(el) {
    var panel = el && el.closest ? el.closest('[data-tabpanel][data-fm-tab]') : null;
    return panel ? panel.getAttribute('data-fm-tab') : null;
  }

  /* «Фильтр» таблицы: окно открывает страница (у кнопки виджета нет data-modal) */
  document.addEventListener('fmtableaction', function (e) {
    if (!e.detail || e.detail.action !== 'FILTER' || !loaded || !Filter) return;
    var tab = tabOf(e.target);
    if (!tab) return;
    Filter.open({ indicators: store.indicators(tab), value: filters[tab] }).then(function (value) {
      if (!value) return;
      filters[tab] = value;
      renderTab(tab);
    });
  });
  document.addEventListener('fmtablefilterreset', function (e) {
    var tab = tabOf(e.target);
    if (!tab || !loaded) return;
    filters[tab] = noFilter();
    renderTab(tab);
  });

  /* ---------- фиксация расчёта РСБУ ---------- */
  function fiName(id) {
    var hit = store.indicators('RAS').filter(function (x) { return x.fiId === id; })[0];
    return hit ? hit.fiName : id;
  }
  function doFixRas(id) {
    if (!loaded || isView() || store.state().busy) return;
    var res = store.fixRas(id);
    if (res && res.ok) syncUrl();
    if (res && res.ok && window.FinMetricsNotify) window.FinMetricsNotify.rasFixed(fiName(id));
    /* контрол, на котором стоял фокус, заменён чипом — фокус переносим на чип */
    var chip = document.querySelector('#panel-ras [data-fm-fixed-chip]');
    if (chip) chip.focus();
  }
  document.addEventListener('fmtableaction', function (e) {
    var d = e.detail;
    if (!d) return;
    if (d.action === 'FIX_RAS') doFixRas(d.fiId);
  });

  /* Служебный переключатель состояния фиксации — таб System панели прототипа (не в интерфейсе):
     состояния включает и сам пересчёт (зафиксировано → после пересчёта → фиксация снята, Э5), а
     переключатель или адрес `rasFix` задают их напрямую; состояние сохраняется в хранилище
     вместе с переносами (RE0034, Э4). */
  function syncUrl() {
    try {
      var u = new URL(window.location.href);
      u.searchParams.set('rasFix', store.rasState());
      window.history.replaceState(null, '', u.toString());
    } catch (e) { /* file:// и т. п. */ }
  }
  (window.PP_SYSTEM = window.PP_SYSTEM || []).push(
    { id: 'ras-state', title: 'Фиксация расчёта РСБУ', desc: 'Нет фиксации · зафиксировано до пересчёта · после позднего платежа и пересчёта.',
      options: [{ value: 'none', label: 'Нет' }, { value: 'fixed', label: 'Зафиксировано' }, { value: 'recalc', label: 'После пересчёта' }],
      value: function () { return store.rasState(); },
      set: function (v) { store.setRasState(v); syncUrl(); } },
    { id: 'ras-reset', title: 'Фиксация расчёта РСБУ и переносы', action: 'Сбросить',
      run: function () {
        store.resetRas();
        try {
          var u = new URL(window.location.href);
          u.searchParams.set('rasFix', 'none');
          u.searchParams.set('rasMoves', 'none');
          window.history.replaceState(null, '', u.toString());
        } catch (e) { /* file:// и т. п. */ }
      } }
  );

  /* ---------- подтверждение действия ---------- */
  var pending = null;
  function confirmAction(text, onOk) {
    $('fm-confirm-text').textContent = text;
    pending = onOk;
    /* подтверждения открываются и поверх окна фиксации (Э6) */
    window.DSModal.open($('fm-confirm-scrim'), { nested: true });
  }
  $('fm-confirm-ok').addEventListener('click', function () {
    var fn = pending; pending = null;
    window.DSModal.closeTop(true);
    if (fn) fn();
  });

  /* ---------- фиксации ЭПС/ВБС: удаление ---------- */
  /* Корзина есть у каждой строки. Удалить можно только последнюю фиксацию ФИ: у остальных клик
     даёт снек ошибки (ответ 33 задачи RE0033), у последней — подтверждение, удаление и тост. */
  document.addEventListener('fmfixationaction', function (e) {
    var d = e.detail;
    if (!d || d.action !== 'REMOVE' || !loaded || isView() || store.state().busy) return;
    var rec = store.fixations().filter(function (f) { return f.fixationId === d.fixationId; })[0];
    if (!rec) return;
    var notify = window.FinMetricsNotify;
    if (!rec.isLast) {
      if (notify) notify.fixationNotLast();
      return;
    }
    confirmAction('Удаление фиксации ЭПС/ВБС финансового инструмента "' + rec.fiName + '" на ' + Table.fmtDate(rec.changeDate), function () {
      var res = store.removeFixation(rec.fixationId);
      if (!notify) return;
      if (res && res.ok) notify.fixationRemoved();
      else if (res && res.error === 'NOT_LAST') notify.fixationNotLast();
    });
  });

  /* ---------- действия шапки ---------- */
  function pageEvent(action) {
    var host = document.querySelector('.screen');
    if (host) host.dispatchEvent(new CustomEvent('fmpageaction', { bubbles: true, detail: { action: action } }));
  }

  document.addEventListener('click', function (e) {
    var btn = e.target.closest ? e.target.closest('[data-fm-act]') : null;
    if (!btn || btn.disabled || btn.getAttribute('aria-disabled') === 'true' || btn.hidden || !loaded) return;
    var act = btn.getAttribute('data-fm-act');
    if (act === 'CALCULATE') {
      if (isView() || store.state().busy) return;
      /* нераспределённая дельта РСБУ — сначала предупреждение (RE0034, Э5): отмена пересчёт не запускает */
      var un = store.rasUnallocated();
      var run = function () {
        store.calculate().then(function (res) {
          if (window.FinMetricsNotify) window.FinMetricsNotify.calculation(res);
          syncUrl();
        });
      };
      if (un && window.PostRsbuRecalcWarning) {
        window.PostRsbuRecalcWarning.open({ amount: un.amount, currencyCode: un.currencyCode, fiName: fiName(un.fiId), date: un.date })
          .then(function (ok) { if (ok) run(); });
      } else run();
    } else if (act === 'FIXATION') {
      /* окно фиксации ведёт себя само (PostFixationModal): готовая фиксация приходит в стор,
         страница перерисуется по событию 'fixation-added' */
      if (isView() || store.state().busy || !window.PostFixationModal) return;
      window.PostFixationModal.open();
    } else if (act === 'EXPORT') {
      pageEvent(act);
      if (download && !exporting) download.open({ encrypted: ENCRYPTED });
    }
  });

  /* ---------- выгрузка отчёта ----------
     Кебаб над вкладками выгружает всю страницу. Сеть Сигма (внешний интернет) — с шифрованием,
     Альфа / Омега (внутренние) — без; в продукте сеть по логину, в прототипе — ?net=sigma
     (по умолчанию Альфа). ?download=fail — демо ошибки выгрузки. Файла нет: выгрузка
     имитируется задержкой, повторный запуск, пока она идёт, игнорируется (кебаб не выключаем:
     выключение уронило бы фокус, который окно только что вернуло на кебаб). */
  var query = new URLSearchParams(window.location.search);
  var ENCRYPTED = query.get('net') === 'sigma';
  var exporting = false;
  var download = window.PostDealDownloadReportModal && $('fm-download-scrim')
    ? window.PostDealDownloadReportModal.bind($('fm-download-scrim'), {
        employees: window.MOCK_REPORT_EMPLOYEES,
        run: function () {
          exporting = true;
          setTimeout(function () {
            exporting = false;
            var notify = window.FinMetricsNotify;
            if (!notify) return;
            if (query.get('download') === 'fail') notify.exportFailed(); else notify.exportDone();
          }, 600);
        }
      })
    : null;

  /* ---------- сторы ---------- */
  function openStores() {
    var cards = window.FinInstrumentsStore;
    var trees = window.ProductTreeStore;
    var cpt = window.CounterpartiesStore;
    if (!deal || !store || !cards || !Table || !Kpi || !Fix) return;
    Promise.all([store.ready, cards.ready, trees ? trees.ready : null, cpt ? cpt.ready : null]).then(function () {
      if (trees && String(trees.dealId()) !== openedId) trees.use(deal.id);
      if (String(cards.dealId()) !== openedId) cards.use(deal.id);
      store.use(deal.id);
      loaded = true;
      store.on('change', function (d) {
        /* идёт расчёт — меняется только шапка (лоадер и блокировка); по его итогу — всё */
        if (d && d.reason === 'calculating') { paintHeader(); renderTab('RAS'); renderTab('FIXATIONS'); }
        else refreshAll();
      });
      window.DealsStore.on('change', function (d) {
        if (d && d.deal === deal) { paintHeader(); renderTab('FIXATIONS'); }
      });
      refreshAll();
      if (window.dsIcons) window.dsIcons.apply(document);
    });
  }

  buildNav();
  paintCrumbs();
  bindTabs();
  if (Filter && $('fm-filter-scrim')) Filter.bind($('fm-filter-scrim'));
  openStores();
  if (window.dsIcons) window.dsIcons.apply(document);
})();
</script>
</body>
</html>
