<!-- Локальный компонент «Карточка финансового инструмента» (FinInstrumentCard) —
     подчасть тайла «Финансовые инструменты» (FinInstrumentsTile), лежит в его папке.
     Вшивается общим сборщиком (.agents/tools/assemble.mjs) отдельной меткой
     ds-include на странице сделки: сборщик не раскрывает метки внутри фрагмента.

     Корень фрагмента — скрытый контейнер с <template>: карточек в тайле много и
     состав полей у них разный (тип ФИ, заполненность, ошибка, прикреплённые
     инструменты), а через метку ds-include передаются только id/class/state/mode.
     Поэтому компонент отдаёт ЭТАЛОН разметки, а карточки по данным рисует
     FinInstrumentCard.js (PostCardFinInstrument.html) — им же тайл рисует список.

     data-state — состояние карточки (колонки макета «Card-Fininstrument»):
                  empty не заполнено | data заполнено (ошибки нет — снята 17.10.2026)
     data-mode  — режим прав: edit | view (нет меню, «+ Добавить» и ⇄)
     Развёрнута / свёрнута — аккордеон Card ДС (.tile--collapsed на корне).

     Эталон ниже — кредит «Заполнено», правка, развёрнут; значения — с макета,
     разметка — вывод PostCardFinInstrument.html по fixtures.json.

     Зона помечена data-off-grid: ширину карточке задаёт список тайла, а не
     12-колоночная сетка страницы. -->
<div hidden
